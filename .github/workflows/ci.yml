name: CI

# Why this exists (OBRS-393): until this file, OBRS-frontend ran ZERO tests in
# CI — .github/workflows/ held only adr-access-model-gate.yml, while
# OBRS-backend has run unit + integration on every push since day one. A
# frontend dev tests its own feature branch, merges to dev, and nothing ever
# tested merged dev, so a semantic merge conflict surfaced only when the next
# session tripped over it — a full re-work cycle for a break that a 3-minute
# job catches at push time.
#
# --reporters=dots is MANDATORY, not cosmetic. Karma's default `progress`
# reporter repaints its status bar after every one of ~2.4k tests; a terminal
# collapses those repaints, a CI log (and an AI agent's pipe) keeps every one.
# Measured on a fully passing run: default = 276,346 chars, dots = 7,284 chars
# — 97% of the log was ANSI cursor-up redraw, same 50s runtime, zero
# information lost (the default was double-printing each error, not reporting
# more). Do not remove the flag.

on:
  push:
    branches: [dev, sit]
  pull_request:
    branches: [dev, main]

# OBRS-1442: every job below carries `timeout-minutes`. GitHub's default is 360 minutes
# (six hours), and on 2026-08-19 that default let a single step run for 3h10m without one
# test executing: `Install Playwright Chromium` stalled on three runs at once
# (32226812923, 32225735192, 32225550203). Nothing anywhere says "hung" -- `gh pr checks`
# prints the same `pending` at minute 1 and at minute 204 -- and `release-task.ps1` gate
# 2.7 refuses to close a card while CI has no verdict, so the stall froze the reviews and
# the close-outs behind it too.
#
# The caps are measured, not chosen. `gh run view <id> --json jobs` over the last 40
# completed CI runs (n=38 per job after dropping skipped and cancelled) gives job maxima
# of 2.1m for Unit Tests, 0.9m for Build Smoke Check, and 18.8m for E2E Gate once run
# 32225550203 is set aside -- that one finished green in 41.6m, but 25m15s of it was the
# stalled install, so it measures the incident, not the lane.
#
# Each cap sits above the worst case its job can legitimately reach, including the retry
# budget e2e-gate now grants itself below. Deliberately not tighter: a cap that fires on a
# slow-but-healthy run gets re-run until green, and a gate people re-run is not a gate.
# Raise one when a measurement says to, never because a run went red once.
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Measured max 2.1m (n=38). 10 covers a cold npm cache, which is the only thing here
    # that varies by minutes rather than seconds.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Pure-node, zero-dependency gate (OBRS-469): fail fast on i18n key-set drift
      # BEFORE the expensive npm ci + Karma run, so a missing/space-typo'd translation
      # key is caught here instead of printing a raw key onto a user's screen. Runs as
      # a step in this existing job (not a new workflow) to spend no extra runner minutes.
      # It has since grown three more checks that need no extra tooling and belong on
      # the same cheap step: the booking-policy numbers must interpolate (OBRS-564), the
      # privacy notice must stay tied to a published version (OBRS-628 AC-3), and no
      # locale may hold a visibly truncated copy of a long text (OBRS-628 AC-9).
      - name: i18n parity, policy-number and privacy-version gates
        run: npm run test:i18n

      # Same shape and same rationale (OBRS-463): a pure-node gate before npm ci.
      # An auth page that renders the split-layout shell without importing the
      # partial that styles it produces NO error at build or runtime -- it just
      # ships an unreachable signup form to phones. Costs no extra runner minutes.
      - name: auth split-layout style gate
        run: npm run test:auth-layout

      # Third pure-node gate (OBRS-569). AlertService takes a plain string, so
      # translation is every caller's job and there is no chokepoint to fix once --
      # 21 call sites had drifted, including alertService.error('error') and
      # .success('succ') on the OTP LOGIN path. design-system.md Sec.9 already
      # forbade this in prose; prose does not fail a build. Costs no extra minutes.
      - name: hardcoded alert string gate
        run: npm run test:alert-i18n

      # Fourth pure-node gate (OBRS-520). An --admin-* token declared only in the
      # light .admin-shell block, or a var(--admin-*) pointing at a token nobody
      # declared, is silent everywhere: it compiles, it passes unit tests (which
      # cannot see colour), and it looks correct until someone opens dark mode.
      # That is how .admin-btn-danger shipped at 1.71:1 -- an invisible "Un-board"
      # label -- and how a sticky table header stayed a bright band on the dark
      # archive table. Costs no extra runner minutes.
      - name: admin theme dark-mode token gate
        run: npm run test:theme-tokens

      # Companion gate to the one above (OBRS-740), covering the contrast case
      # that one structurally cannot see. The OBRS-734 runtime probe measured
      # backgrounds with getComputedStyle().backgroundColor, which returns
      # rgba(0,0,0,0) for a GRADIENT -- so every gradient-filled button was
      # skipped while the run still reported "0 elements below AA". The floating
      # usability-report FAB hid in the same blind spot for two cards: it renders
      # OUTSIDE .admin-shell, so var(--accent, #4dbeef) never resolved and the
      # FALLBACK literal shipped at 2.12:1 on every route in both themes.
      # This gate reads the SCSS, expands every gradient stop, and resolves
      # tokens per theme world (base/admin/staff x light/dark) so "it passes in
      # the default theme" stops counting as an answer. Costs no extra runner
      # minutes.
      - name: brand fill contrast gate
        run: npm run test:brand-contrast

      # Fifth pure-node gate (OBRS-506). A `.data$` subscribe callback guarded as
      # `if (data) { ... }` with no else silently KEEPS its previous cached rows on
      # a null emission (AdminCollectionStore.clear(), e.g. on logout) instead of
      # resetting them -- no error, no warning, stale rows visible under the next
      # error banner. That exact shape shipped once (OBRS-467, usability-reports)
      # and was found latent in 19 more subscribe sites by this card's sweep.
      # Costs no extra runner minutes.
      - name: store null-handling gate
        run: npm run test:store-null

      # Companion gate to the one above (OBRS-1252), for the store failure NgRx has
      # no signal at all for. `createFeatureSelector('key')` returns `undefined`
      # when nothing registered `'key'` -- no throw, no console warning, and the
      # selector's TYPE is unchanged, so every consumer downstream type-checks
      # while receiving undefined at runtime. e-ticket.module registered one of the
      # five slices ETicketComponent reads, and a guest opening /e-ticket by direct
      # link got a ticket with 9 fields showing `-` and ZERO /api/ requests. It hid
      # for months because every in-app route to that page walks through a module
      # that registers those same slices into the same store. Costs no extra
      # runner minutes.
      - name: ngrx feature-registration gate
        run: npm run test:store-feature-registration

      # Sixth pure-node gate (OBRS-608, enforcing ADR-0028). Every object literal
      # inherits from Object.prototype, so `MAP[key] ?? f`, `(key && MAP[key]) || f`
      # and `key in MAP` all resolve a key of 'constructor'/'__proto__' to the Object
      # FUNCTION -- non-nullish AND truthy, so no fallback fires and the caller holds a
      # function where it expected a record. OBRS-427 SHIPPED this in the very fix
      # meant to prevent it; OBRS-601 then found 23 instances in 5 clusters, including
      # one that threw inside every route guard. Those 23 are fixed and nothing stopped
      # the 24th -- this is the 24th's stop. Costs no extra runner minutes.
      - name: prototype-chain map lookup gate
        run: npm run test:proto-key

      # Seventh pure-node gate (OBRS-391). Until that card the payment page rendered
      # `<input id="creditCardNo">` and `<input id="cvv">` on our own origin and fed
      # them to `Omise.createToken('card', ...)`, which put the whole site in PCI DSS
      # SAQ A-EP (~140 requirements plus quarterly ASV scans, permanently) instead of
      # SAQ A, and left clause 5.5(f) of the Omise merchant agreement open. Omise's
      # hosted iframe collects those fields now. Deleting the inputs took a day; keeping
      # them deleted is the requirement, and re-adding one is the most natural edit
      # anybody could make to a payment form -- the compiler and every unit test stay
      # green while the cost lands months later as an audit obligation or, under clause
      # 12.1(a), a merchant account suspended without notice. The gate self-tests its own
      # must-catch/must-NOT-catch cases before it will report on the tree, so it cannot
      # degrade into a silent OK. Pure file reads -- costs no extra runner minutes.
      - name: cardholder-data input gate
        run: npm run test:no-card-inputs

      # Eighth pure-node gate (OBRS-719). Sibling to the one above and aimed at the other
      # half of the same PCI surface: that one keeps cardholder data OFF this origin, this
      # one keeps the list of scripts RUNNING on the payment page honest. PCI DSS 6.4.3(c)
      # requires a written inventory of every script on that page with a justification for
      # each, and 11.6.1 requires unauthorised changes to them to be detected -- and the
      # natural edit that breaks both is the most ordinary one there is: adding a widget,
      # an analytics snippet or a chat bubble to index.html. Nothing else goes red for it.
      # Checks that index.html and every template stay script-tag-free, that each file
      # loading a script at runtime is inventoried WITH the origin it actually names (and
      # vice versa -- a stale entry fails too), that angular.json's bundled scripts match,
      # and that netlify.toml's CSP still has no 'unsafe-inline' in script-src and still
      # names a report-uri. Self-tests its own must-catch/must-NOT-catch cases first, so it
      # cannot degrade into a silent OK. Pure file reads -- costs no extra runner minutes.
      - name: payment-page script inventory gate
        run: npm run test:payment-scripts

      # Another pure-node gate (OBRS-907; no ordinal claimed here on purpose -- the
      # existing "Ninth" label below, OBRS-536/test:local-env, predates this step and
      # sits later in the file, so numbering this one "Ninth" too or "Tenth" out of
      # physical order would just be a stale number waiting to happen).
      #
      # 14+ stylesheets each hand-rolled their own rotate/shimmer @keyframes for a
      # loading spinner/skeleton before this card introduced ONE shared primitive
      # (<app-loading-state> + src/styles/_loading.scss). Nothing stopped a 15th the
      # same way the first 14 happened -- one component at a time, each addition
      # looking small and local. This gate flags any NEW rotate- or shimmer-shaped
      # @keyframes outside a checked-in debt register of the pre-existing duplicates
      # (owned by OBRS-909/910), and fails just as hard on a register row that's gone
      # stale (migrated but not deleted from the list) -- same both-directions
      # discipline as e2e/support/dark-override-allow.ts. Self-tests its own
      # must-catch/must-NOT-catch fixtures first. Pure file reads -- costs no extra
      # runner minutes.
      - name: loading-primitive duplication gate
        run: npm run test:loading-primitives

      # OBRS-967. A duplicated `@for ... track` key fails nothing: Angular logs NG0955
      # to console.warn, paints every row anyway, and the suite reports success. 39
      # placeholder loops were broken on dev while `ng test` printed "4612 of 4612
      # SUCCESS" -- 33 of those specs were emitting the warning the entire time, and a
      # row-count assertion (`expect(skeletonRows.length).toBe(5)`) stayed green through
      # all of it. The cause is that `Array.from({ length: 5 })` is five copies of
      # `undefined`, so tracking by the loop variable hands @for one key five times.
      # This gate flags a @for over an array-of-undefined field (found by pairing the
      # template with its own component .ts) or over a `skeleton*`/`placeholder*` named
      # collection, unless it tracks by $index. Self-tests its own must-catch/
      # must-NOT-catch fixtures first. Pure file reads -- costs no extra runner minutes.
      - name: duplicate @for track key gate
        run: npm run test:track-keys

      # OBRS-602. The Playwright suite had grown to 223 cases nobody had ever seen pass
      # together, because playwright.config.ts swept the whole e2e/ directory while nine
      # specs were written for environments it does not provide. Lane membership is now
      # declared in e2e/lanes.json; this asserts the declaration still matches the files
      # on disk and the gate config, so a new spec cannot silently belong to everything
      # or to nothing. Pure file reads -- costs no extra runner minutes.
      #
      # This step checks the DECLARATION only. The lane itself now runs for real in the
      # `e2e-gate` job below (OBRS-750) -- until that card it ran nowhere but a
      # developer's box, which made it a convention rather than a gate.
      #
      # Do not state the lane's case count here. This comment claimed 49 long after the
      # lane had grown to 102, and that stale number was read back and reported as
      # current in the very session that closed OBRS-735 -- the card about a false claim
      # in this same comment block. A count belongs where something recomputes it: the
      # `e2e-gate` job prints it on every run, and docs/e2e-lanes.md is maintained
      # alongside lanes.json. Prose here has no gate and rots silently.
      #
      # OBRS-735 -- the reason this comment used to give for that was FALSE, so do not
      # reinstate it. It claimed Actions here is a hard $0 monthly minute ceiling shared
      # with the SIT deploy. Neither half is true:
      #   * `th-peeranut/OBRS-frontend` is a PUBLIC repo, so Actions minutes are
      #     UNMETERED. GitHub's free-tier minute ceiling applies to the PRIVATE
      #     OBRS-backend repo and does not reach this workflow. Quote no figure for it
      #     here -- naming one is how the wrong repo's constraint got copied in.
      #   * There is no SIT deploy in this workflow. It has two jobs, `unit-tests` and
      #     `build`. The SIT frontend is deployed by NETLIFY from netlify.toml -- a
      #     different product on a different budget, which Actions minutes cannot
      #     exhaust.
      # Stating a budget that does not exist is not a harmless stale comment: it was
      # read as a live blocker and held OBRS-717 for six days for nothing. Runner cost
      # for the lane is a wall-clock trade, not a quota one.
      - name: E2E lane membership gate
        run: npm run test:e2e-lanes

      # OBRS-1207. The report FAB steps aside for anything clickable underneath it, and
      # `obrs-1207-fab-occlusion.spec.ts` is the gate that proves it does. Both sides need
      # the same list of what "clickable" means, and they live in two compilation roots
      # that cannot import from each other -- so the copies are CHECKED rather than hoped
      # for. Drift is green-and-worthless in both directions: the gate testing a rule the
      # app has dropped, or the app yielding for something the gate never looks for.
      - name: FAB yield selector parity gate
        run: npm run test:fab-yield-selector

      # Ninth pure-node gate (OBRS-536). `environment.sit.ts` and `environment.prod.ts` read
      # their keys from two GITIGNORED files, so the committed side of that contract moves with
      # every commit while the other side cannot. OBRS-424 added `maptilerKey` and updated both
      # things a commit CAN update -- the example template and scripts/inject-sit-env.js -- and
      # every checkout that already had an environment.local.ts still broke, with a TS2339 that
      # Playwright reports as `Timed out waiting 120000ms from config.webServer`. Two worktrees
      # on the reporting machine were in that state at once, and OBRS-617 had already routed its
      # own config around that lane rather than fix it.
      #
      # What runs HERE is the half CI can see: the example template and BOTH inject-*.js
      # generators must declare exactly the fields the committed environment files read. The
      # generator half is the one with teeth -- a field added to environment.prod.ts but not to
      # inject-prod-env.js breaks the PROD build on the host while every local checkout stays
      # green, and nothing else in this workflow builds the prod configuration. The developer's
      # own copy is checked by the same script through npm `pre` hooks; neither gitignored file
      # exists on a runner, and the script treats their absence as normal rather than as a
      # finding. It self-tests its own parser first, so it cannot degrade into a silent OK.
      # Costs no extra runner minutes.
      - name: gitignored environment file shape gate
        run: npm run test:local-env

      # Tenth pure-node gate (OBRS-946). The gate above checks field NAMES; this one
      # checks the one VALUE rule that decides whether a prod bundle can take money,
      # and it checks it in both places that hold a copy of it.
      #
      # Both copies demanded an Omise public key starting with `pkey_live_`, which
      # Omise does not issue - the live key is `pkey_` + 19 chars with no environment
      # segment (only the TEST key is labelled). So `npm run build:prod` exited 1 on
      # the real key and a hand-written config would have refused to boot: prod was
      # unpublishable, and nothing in this workflow could see it, because no lane here
      # builds the prod configuration and every unit-test fixture was invented from
      # the same wrong assumption the gates encoded.
      #
      # This step is the answer to "why did the tests pass": it asserts the pattern is
      # byte-identical in scripts/inject-prod-env.js and prod-config-guard.ts, then
      # runs it against key shapes that were observed rather than imagined - including
      # the live key measured on the prod VM. Fixing one gate and leaving its twin is
      # what happened in OBRS-926 and again in OBRS-946; from here it is a red build.
      - name: Omise prod public-key rule gate
        run: npm run test:omise-key

      # Tenth pure-node gate (OBRS-1194). `<html lang>` is invisible to every test the
      # team can run: nothing throws, no unit test can observe it, and the app looks
      # identical in the browsers we develop in. It is only wrong on a VISITOR's device
      # -- and there it is wrong for the whole page at once. Prod declared `lang="en"`
      # while rendering Thai, so a phone with "always translate English" ran a machine
      # translation over text that was already Thai: หนองชาก became "ชุชาก", ผู้ใหญ่
      # became "โดยทั่วไป", and the Material Symbols LIGATURES -- whose element text is
      # the literal English icon name -- turned into the words "เมนู" and "ธง" where the
      # icons belong. Measured against prod's own i18n bundle and /api/stops, which both
      # held the correct Thai, so no server-side check could ever have caught it.
      - name: index.html lang/title gate
        run: npm run test:index-lang

      # Thirteenth pure-node gate (OBRS-1202). The other half of the same prod
      # incident, and the half `<html lang>` cannot cover: the owner decided NOT to
      # switch browser translation off (passengers on this route read Burmese and
      # Khmer, which the app's own th/en/zh switcher does not offer), so a
      # translated page is a SUPPORTED state -- and in that state every Material
      # Symbols ligature is a genuine English word the translator will happily
      # replace, turning the hamburger into the word "เมนู". No test can see it:
      # the text is already the icon name, and the font hides it on every machine
      # we develop on. So the guard is counted here instead, in both directions --
      # an unguarded icon fails, and so does the STATIC `translate="no"`, which
      # ngx-translate's `[translate]` directive claims as a translation key and
      # renders as the word "nono" (measured, karma probe 2026-08-11).
      - name: Material Symbols translate gate
        run: npm run test:icon-translate

      # Eleventh pure-node gate (OBRS-911). netlify.toml now carries an `ignore` command,
      # and its polarity is the opposite of everything else in this file: exit 0 CANCELS
      # the Netlify build. That makes a mistake in it INVISIBLE by construction - a wrong
      # skip produces no build log, no failed check and nothing red, and `sit` (this site's
      # production branch) keeps serving the previous bundle while the push reads as
      # deployed. There is no later stage that can catch it, so it is caught here: the gate
      # feeds fixed path lists to the decision function and asserts deny-by-default and the
      # fail-safe, and it pins the two facts OUTSIDE the script that the decision depends
      # on - the narrow tsconfig.app.json program that makes *.spec.ts provably not a build
      # input, and the byte-identical [build].command that must never fall back to the UI
      # value.
      - name: netlify ignore-command gate
        run: npm run test:netlify-ignore

      # Twelfth pure-node gate (OBRS-1246). OBRS-1222 switched the station roster's
      # error reporting from the global modal to an inline surface, and the surface
      # reached 2 of the 6 pages that dispatch the fetch. The other 4 did not get
      # quieter, they went SILENT -- origin and destination render as `-` with nothing
      # saying why, and on /e-ticket that is the ticket the customer hands over at the
      # door. Nothing removed those surfaces; they were never added, because the "2 of
      # 6" count was done BY HAND. The 7th page will be added by someone who has never
      # read this card, so the count runs here on every push instead, in both
      # directions: a dispatcher with no surface fails, and so does dropping
      # `skipErrorAlert: true` from station.effect.ts, which would put the OBRS-642
      # modal back on top of every surface. Self-tests its own matcher first, so it
      # cannot decay into a green no-op the way the hand count did.
      - name: station-load failure surface gate
        run: npm run test:station-surface

      # Thirteenth pure-node gate (OBRS-1415). /i18n/*.json is the only shipped asset
      # that carries words, changes on most deploys, and has a filename that never
      # changes - so it is the one asset for which a browser cache is a correctness
      # question rather than a performance one. prod served it with no Cache-Control at
      # all and returning visitors read the 12 Aug translations under the new bundle,
      # i.e. raw i18n keys on the home page, including the notice telling customers
      # where to book instead. SIT was measured NOT to share the hole - Netlify already
      # sends a revalidating default - which is exactly why the netlify.toml block needs
      # a gate: nothing breaks the day someone deletes it as redundant. It breaks later,
      # on the unrelated push that adds a Cache-Control to the `/*` block.
      - name: i18n cache-header gate
        run: npm run test:i18n-cache

      # A Leaflet marker is positioned by a transform on an element Leaflet has
      # already made `absolute`. A component stylesheet that re-declares that
      # `position` through ::ng-deep outweighs Leaflet and wins, and `relative`
      # drops the marker back into the pane's flow: every pin after the first is
      # drawn 18px * N too low, which at a fleet-wide zoom is tens of kilometres.
      # That shipped and the owner found it by seeing buses in the sea. No unit
      # test can see it -- the specs assert marker CONTENT, and layout is never
      # exercised at a real size -- so the check has to read the stylesheets.
      - name: Leaflet marker position gate
        run: npm run test:marker-position

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Google Chrome pre-installed, so karma-chrome-launcher
      # resolves ChromeHeadless without an extra install step.
      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --reporters=dots

  build:
    name: Build Smoke Check (AOT + budgets)
    runs-on: ubuntu-latest
    # Measured max 0.9m (n=38) -- the AOT build itself is under a minute and `npm ci` is
    # the rest. Same 10 as unit-tests for the same cold-cache reason.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches what `ng test` cannot: AOT template errors, and the bundle budgets
      # in angular.json (initial > 2mb is an error, not a warning). This output is a
      # smoke check and is never deployed -- `ci-smoke` has no fileReplacements, so it
      # builds against environment.ts (localhost). Deploys use `sit` / `prod`.
      - name: Build bundle (AOT + budget smoke check)
        run: npm run build -- --configuration ci-smoke

  # OBRS-750. The deterministic E2E lane (playwright.gate.config.ts) is the repo's
  # designated merge gate per OBRS-602, and until this job it had never run anywhere
  # except a developer's machine -- an unenforced gate, which is the same thing as no
  # gate. The reason previously given for keeping it out was a GitHub Actions minute
  # budget that does not exist for this repo (OBRS-735 established that this repo is
  # PUBLIC, so Actions minutes are unmetered, and the SIT frontend deploys from Netlify,
  # not from here). What remains is a wall-clock cost, which is a real trade but a much
  # smaller one than the false quota it was mistaken for.
  #
  # This job can be trusted to mean something because the lane is HERMETIC BY
  # CONSTRUCTION, not by assertion: playwright.gate.config.ts deliberately serves the
  # frontend with the DEFAULT configuration, so `apiUrl` points at localhost:8080 where
  # nothing is listening. A request a spec failed to intercept gets ECONNREFUSED rather
  # than quietly succeeding against live SIT. That is why this can be a blocking gate at
  # all -- it cannot be turned red by a cold-starting Koyeb instance, which is the usual
  # and correct objection to putting E2E on a merge path.
  e2e-gate:
    name: E2E Gate Lane (hermetic)
    runs-on: ubuntu-latest
    # Measured max 18.8m healthy (n=38). The install step below may now spend up to 13m of
    # its own retrying, and the slowest `Run deterministic E2E lane` step measured is
    # 15m53s (run 32225550203), so the worst run that is still doing real work is about
    # 13 + 16 + 1 = 30m. 35 is that with margin; anything under 30 would kill a run that
    # was going to pass.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright drives its OWN bundled Chromium, not the Google Chrome that
      # ubuntu-latest ships (which is what the unit-test job's karma-chrome-launcher
      # picks up). Without this the run fails at browser launch, not at an assertion.
      # `install-deps` pulls the shared libraries that headless Chromium needs on a bare
      # runner image; chromium only, since `projects` declares no other browser.
      #
      # OBRS-1442 split this out of the `--with-deps` one-liner it used to be. Only the
      # browser download below is retried, and a retry has to be safe to start over: this
      # half is `apt-get`, and killing apt mid-transaction leaves a dpkg lock that makes
      # every later attempt fail for a new reason. So the apt half gets a cap and no
      # retry, and the fetch half gets both.
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # OBRS-1442 -- two bounds, deliberately. `timeout` bounds ONE attempt so a stalled
      # fetch is abandoned and retried rather than waited on; `timeout-minutes` bounds the
      # step so that when it does give up, the failure names THIS step instead of the job
      # dying at its own cap with nothing to point at.
      #
      # Measured 2026-08-19: this download normally costs 23s / 27s / 2m24s (runs
      # 32219717206, 32198992009, 32218179772). On the day of the incident the same fetch
      # took 25m15s on run 32225550203 and was still going at 3h10m on 32226812923 -- so
      # it is an intermittent stall, not a dead endpoint, and a fresh attempt is the thing
      # that clears it: `gh run rerun --failed` got it back under 30s by hand. 240s is
      # 1.7x the slowest healthy download measured, and three attempts is that same manual
      # rerun without a human in it. Worst case 3 x 240s + 2 x 15s = 12m30s, inside the 13.
      #
      # `timeout` is coreutils, already on ubuntu-latest. Deliberately not a marketplace
      # retry action: this workflow is the merge gate, and nothing on it should depend on
      # a third-party repository that can change under us.
      #
      # AC-6, the cache decision, written here so it cannot be silently reversed: NO
      # `actions/cache` for the browser. It would save ~27s on a job whose measured median
      # is 14.0m (~3.2%), Actions minutes are unmetered here (OBRS-735, this repo is
      # public), and a cache restore is itself a network fetch from the same
      # infrastructure that stalled -- so it moves the failure mode rather than removing
      # it, while adding a key that must track the exact Playwright version or the lane
      # silently runs a browser the config never pinned. Revisit if the measured download
      # median passes ~2 minutes.
      - name: Install Playwright Chromium
        timeout-minutes: 13
        run: |
          for attempt in 1 2 3; do
            if timeout -k 10s 240s npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt did not finish within 240s (OBRS-1442 stall); retrying"
            sleep 15
          done
          echo "::error::playwright install did not finish in three attempts -- this is the OBRS-1442 download stall, not a failure of the code under test"
          exit 1

      # No `continue-on-error` and no `retries` override: a red lane must fail the
      # workflow, and a flake must be diagnosed rather than retried into a green tick.
      # The config's `webServer` starts `ng serve` itself (reuseExistingServer is already
      # false when CI is set), so there is nothing to start here.
      #
      # OBRS-584 added `customer-contrast-gate.spec.ts` to this lane. It costs ~2
      # minutes of wall clock -- the largest single spec here -- because it opens
      # eight customer pages in both themes and reads getComputedStyle on every
      # element that renders text, plus a :hover/:focus pass over each page's named
      # controls. That is the price of measuring the CASCADE, which is the only
      # place the defects it finds exist: OBRS-575 shipped a 2.79:1 pill past this
      # very workflow because every other gate here reads stylesheets, and a
      # stylesheet cannot say which rule won. Its first run found 58 open defects,
      # including a dark footer override that had never once painted (OBRS-767).
      #
      # OBRS-767 then added `dark-override-effective.spec.ts`, ~2 minutes more. It
      # is not a second contrast check: it removes each dark-theme.scss declaration
      # from the live CSSOM in turn and fails if nothing on the page moved. That is
      # how the footer defect turned out to be one instance of 48, and it is the
      # only thing here that can see a rule which parses, matches its element, and
      # still loses -- the failure mode that made the footer read as correct in
      # source for the life of the feature. It samples each page TWICE and takes
      # the intersection, which is most of what it costs: one sample turns a
      # PrimeNG fill that settles after first paint into a red build with no defect
      # behind it, and a gate people re-run until it is green is not a gate.
      #
      # The cost is wall clock, not quota. Actions minutes are UNMETERED for this
      # repo (it is public -- OBRS-735), and the SIT frontend deploys from Netlify,
      # not from here. Do not "optimise" it by quietly cutting pages: the spec fails
      # when a page renders too little to measure, precisely so that a shrinking
      # sweep cannot pass as a clean one.
      - name: Run deterministic E2E lane
        run: npm run e2e:gate

      # Only on failure, and only for the run that failed: the config sets
      # trace: 'retain-on-failure' and screenshot: 'only-on-failure', so a green run
      # produces nothing worth keeping. Without this, a CI-only failure has to be
      # re-guessed locally instead of read.
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-gate-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================================
  # OBRS-1442 AC-5 -- TEMPORARY. This block exists to make one CI run that proves the caps
  # actually fire, and the very next commit on this branch removes it. If you are reading this
  # on dev, the revert was lost and this block should be deleted, not fixed.
  # ==========================================================================================
  ac5-proof-job-cap:
    name: AC-5 proof - job cap fires (TEMPORARY)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hang for 20 minutes on purpose
        run: sleep 1200

  ac5-proof-step-cap:
    name: AC-5 proof - step cap fires and names the step (TEMPORARY)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hang for 20 minutes on purpose, bounded by the step
        timeout-minutes: 1
        run: sleep 1200

  ac5-proof-retry-loop:
    name: AC-5 proof - the install retry loop fails closed (TEMPORARY)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same shape as `Install Playwright Chromium`, with the download replaced by a command
      # that can only stall and the budgets scaled down so the proof costs ~70s instead of 13m.
      - name: Three bounded attempts, then fail
        timeout-minutes: 4
        run: |
          for attempt in 1 2 3; do
            if timeout -k 10s 20s sleep 600; then
              exit 0
            fi
            echo "::warning::attempt $attempt did not finish within 20s; retrying"
            sleep 5
          done
          echo "::error::three attempts, still stalled"
          exit 1
