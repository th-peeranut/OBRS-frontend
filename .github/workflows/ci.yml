name: CI

# Why this exists (OBRS-393): until this file, OBRS-frontend ran ZERO tests in
# CI — .github/workflows/ held only adr-access-model-gate.yml, while
# OBRS-backend has run unit + integration on every push since day one. A
# frontend dev tests its own feature branch, merges to dev, and nothing ever
# tested merged dev, so a semantic merge conflict surfaced only when the next
# session tripped over it — a full re-work cycle for a break that a 3-minute
# job catches at push time.
#
# --reporters=dots is MANDATORY, not cosmetic. Karma's default `progress`
# reporter repaints its status bar after every one of ~2.4k tests; a terminal
# collapses those repaints, a CI log (and an AI agent's pipe) keeps every one.
# Measured on a fully passing run: default = 276,346 chars, dots = 7,284 chars
# — 97% of the log was ANSI cursor-up redraw, same 50s runtime, zero
# information lost (the default was double-printing each error, not reporting
# more). Do not remove the flag.

on:
  push:
    branches: [dev, sit]
  pull_request:
    branches: [dev, main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Pure-node, zero-dependency gate (OBRS-469): fail fast on i18n key-set drift
      # BEFORE the expensive npm ci + Karma run, so a missing/space-typo'd translation
      # key is caught here instead of printing a raw key onto a user's screen. Runs as
      # a step in this existing job (not a new workflow) to spend no extra runner minutes.
      # It has since grown three more checks that need no extra tooling and belong on
      # the same cheap step: the booking-policy numbers must interpolate (OBRS-564), the
      # privacy notice must stay tied to a published version (OBRS-628 AC-3), and no
      # locale may hold a visibly truncated copy of a long text (OBRS-628 AC-9).
      - name: i18n parity, policy-number and privacy-version gates
        run: npm run test:i18n

      # Same shape and same rationale (OBRS-463): a pure-node gate before npm ci.
      # An auth page that renders the split-layout shell without importing the
      # partial that styles it produces NO error at build or runtime -- it just
      # ships an unreachable signup form to phones. Costs no extra runner minutes.
      - name: auth split-layout style gate
        run: npm run test:auth-layout

      # Third pure-node gate (OBRS-569). AlertService takes a plain string, so
      # translation is every caller's job and there is no chokepoint to fix once --
      # 21 call sites had drifted, including alertService.error('error') and
      # .success('succ') on the OTP LOGIN path. design-system.md Sec.9 already
      # forbade this in prose; prose does not fail a build. Costs no extra minutes.
      - name: hardcoded alert string gate
        run: npm run test:alert-i18n

      # Fourth pure-node gate (OBRS-520). An --admin-* token declared only in the
      # light .admin-shell block, or a var(--admin-*) pointing at a token nobody
      # declared, is silent everywhere: it compiles, it passes unit tests (which
      # cannot see colour), and it looks correct until someone opens dark mode.
      # That is how .admin-btn-danger shipped at 1.71:1 -- an invisible "Un-board"
      # label -- and how a sticky table header stayed a bright band on the dark
      # archive table. Costs no extra runner minutes.
      - name: admin theme dark-mode token gate
        run: npm run test:theme-tokens

      # Fifth pure-node gate (OBRS-506). A `.data$` subscribe callback guarded as
      # `if (data) { ... }` with no else silently KEEPS its previous cached rows on
      # a null emission (AdminCollectionStore.clear(), e.g. on logout) instead of
      # resetting them -- no error, no warning, stale rows visible under the next
      # error banner. That exact shape shipped once (OBRS-467, usability-reports)
      # and was found latent in 19 more subscribe sites by this card's sweep.
      # Costs no extra runner minutes.
      - name: store null-handling gate
        run: npm run test:store-null

      # Sixth pure-node gate (OBRS-608, enforcing ADR-0028). Every object literal
      # inherits from Object.prototype, so `MAP[key] ?? f`, `(key && MAP[key]) || f`
      # and `key in MAP` all resolve a key of 'constructor'/'__proto__' to the Object
      # FUNCTION -- non-nullish AND truthy, so no fallback fires and the caller holds a
      # function where it expected a record. OBRS-427 SHIPPED this in the very fix
      # meant to prevent it; OBRS-601 then found 23 instances in 5 clusters, including
      # one that threw inside every route guard. Those 23 are fixed and nothing stopped
      # the 24th -- this is the 24th's stop. Costs no extra runner minutes.
      - name: prototype-chain map lookup gate
        run: npm run test:proto-key

      # Seventh pure-node gate (OBRS-391). Until that card the payment page rendered
      # `<input id="creditCardNo">` and `<input id="cvv">` on our own origin and fed
      # them to `Omise.createToken('card', ...)`, which put the whole site in PCI DSS
      # SAQ A-EP (~140 requirements plus quarterly ASV scans, permanently) instead of
      # SAQ A, and left clause 5.5(f) of the Omise merchant agreement open. Omise's
      # hosted iframe collects those fields now. Deleting the inputs took a day; keeping
      # them deleted is the requirement, and re-adding one is the most natural edit
      # anybody could make to a payment form -- the compiler and every unit test stay
      # green while the cost lands months later as an audit obligation or, under clause
      # 12.1(a), a merchant account suspended without notice. The gate self-tests its own
      # must-catch/must-NOT-catch cases before it will report on the tree, so it cannot
      # degrade into a silent OK. Pure file reads -- costs no extra runner minutes.
      - name: cardholder-data input gate
        run: npm run test:no-card-inputs

      # OBRS-602. The Playwright suite had grown to 223 cases nobody had ever seen pass
      # together, because playwright.config.ts swept the whole e2e/ directory while nine
      # specs were written for environments it does not provide. Lane membership is now
      # declared in e2e/lanes.json; this asserts the declaration still matches the files
      # on disk and the gate config, so a new spec cannot silently belong to everything
      # or to nothing. Pure file reads -- costs no extra runner minutes.
      #
      # It does NOT run the deterministic E2E lane itself (`npm run e2e:gate`, 49 cases,
      # ~1.7 min plus a browser). The lane runs locally before merge; wiring it in here
      # is still an owner decision.
      #
      # OBRS-735 -- the reason this comment used to give for that was FALSE, so do not
      # reinstate it. It claimed Actions here is a hard $0 monthly minute ceiling shared
      # with the SIT deploy. Neither half is true:
      #   * `th-peeranut/OBRS-frontend` is a PUBLIC repo, so Actions minutes are
      #     UNMETERED. GitHub's free-tier minute ceiling applies to the PRIVATE
      #     OBRS-backend repo and does not reach this workflow. Quote no figure for it
      #     here -- naming one is how the wrong repo's constraint got copied in.
      #   * There is no SIT deploy in this workflow. It has two jobs, `unit-tests` and
      #     `build`. The SIT frontend is deployed by NETLIFY from netlify.toml -- a
      #     different product on a different budget, which Actions minutes cannot
      #     exhaust.
      # Stating a budget that does not exist is not a harmless stale comment: it was
      # read as a live blocker and held OBRS-717 for six days for nothing. Runner cost
      # for the lane is a wall-clock trade, not a quota one.
      - name: E2E lane membership gate
        run: npm run test:e2e-lanes

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Google Chrome pre-installed, so karma-chrome-launcher
      # resolves ChromeHeadless without an extra install step.
      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --reporters=dots

  build:
    name: Build Smoke Check (AOT + budgets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches what `ng test` cannot: AOT template errors, and the bundle budgets
      # in angular.json (initial > 2mb is an error, not a warning). This output is a
      # smoke check and is never deployed -- `ci-smoke` has no fileReplacements, so it
      # builds against environment.ts (localhost). Deploys use `sit` / `prod`.
      - name: Build bundle (AOT + budget smoke check)
        run: npm run build -- --configuration ci-smoke
