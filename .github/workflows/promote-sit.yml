name: Promote dev to sit (night window)

# OBRS-1042. The frontend is the half of SIT that actually breaks in a live user's face. The sit
# build uses `outputHashing: "all"` with no service worker, and `src/` contains ZERO
# ChunkLoadError handlers across 26 lazy routes - so the moment a new deploy is published, an
# already-open tab 404s on its next lazy chunk and shows nothing a non-IT user could act on. SIT's
# users are staff and the owner, none of them IT. Hence a night window rather than "whenever".
#
# Netlify publishes AUTOMATICALLY from `sit` ("Deploys from sit are published automatically",
# confirmed 2026-08-04), completing in ~40 s. There is no build-then-publish split to hide behind:
# pushing this ref IS publishing to the people using it.
#
# WHY THIS FILE LIVES ON `main`: GitHub fires `schedule` and `workflow_dispatch` only from the
# workflow file on the DEFAULT branch. It pins no versions and builds nothing, so unlike ci.yml it
# has nothing that can rot out of sync with dev.

on:
  # 17:00 UTC Mon/Wed = 00:00 ICT Tue/Thu. ICT is UTC+7 with NO daylight saving.
  # Two nights a week, not seven: Netlify bills a measured 15 credits per deploy, and nightly
  # promotes would exhaust the remaining balance more than a week before it refills.
  schedule:
    - cron: '0 17 * * 1,3'
  workflow_dispatch:
    inputs:
      ignore_window:
        description: 'Bypass the ICT night-window guard (rehearsal only - will publish NOW)'
        type: boolean
        default: false

permissions:
  contents: write  # push origin/dev -> sit
  actions: read    # read dev's CI verdict
  issues: write    # OBRS-1067: file a refusal where a person will see it

concurrency:
  group: promote-sit
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev to sit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # OBRS-1067. Declared once at job level on purpose: the reporting step and the clearing step
    # find each other by EXACT title, so if the two literals ever drifted by one character the
    # clear would stop matching and every failure would open a fresh issue forever.
    env:
      REPORT_TITLE: 'promote-sit: the scheduled SIT promote did not complete'
    steps:
      # OBRS-1359. `fetch-depth: 0` is LOAD-BEARING - do not "tidy" it back to the default.
      #
      # The default is `fetch-depth: 1`, which runs `git fetch --depth=1 origin refs/heads/main*`
      # and writes main's tip into `.git/shallow`, where git treats it as a commit WITH NO PARENTS.
      # The `Fetch dev and sit` step below inherits that boundary, so any history lying under
      # main's tip is never downloaded - and on THIS repo main's tip is NOT an ancestor of sit:
      # measured 2026-08-15, `sit..main = 108` (main is 108 commits past sit; `main..sit` was 0
      # too, but that is not the operative half - see below). So `sit` is invisible on the runner,
      # git cannot see it on dev's ancestry, and the push
      # is refused CLIENT-SIDE with `non-fast-forward` - without GitHub ever being asked. That is
      # why the API answers `ahead_by:167, behind_by:0` for the same two refs in the same minute.
      #
      # It also silently corrupted the gap count: run 31824419279 printed `sit..dev = 60` when the
      # true value was 167 (= `main..dev` 59, plus the grafted main tip itself). A wrong count is
      # worse than a red run - had it truncated to 0, `Decide whether there is anything to promote`
      # would have reported "nothing to promote" and the run would have gone GREEN while sit stayed
      # 167 commits behind.
      #
      # OBRS-backend's twin file is byte-identical here and pushed fine the same night, which is
      # what makes this look like it cannot be the checkout. It is: over there main's tip WAS an
      # ancestor of sit (`sit..main = 0`, measured on that night's main d7f56576 against sit), so
      # the graft sat at or below sit and cut nothing on dev's path.
      #
      # So the variable is `sit..main > 0` - whether main has DIVERGED from sit - not the
      # workflow, not the size of the gap, and NOT `main..sit`. While main's tip is an ancestor
      # of sit, including main == sit exactly, the graft lands at or below sit and cuts nothing,
      # which makes a sit -> main promote safe; what arms this is a commit reaching `main`
      # without going through `sit`. OBRS-1408: this paragraph used to name `main..sit = 0` as
      # the trigger and cite a `main..sit = 75` on the backend that no counting method
      # reproduces. Isolated on a fixture in OBRS-1377 AC-2 (`sit..main = 160`, true
      # `sit..dev = 163`): depth 1 counted 4 and was rejected, depth 0 counted 163 and pushed;
      # while against the real origin with main == sit, depth 1 counted correctly and pushed.
      #
      # Proven off-runner on 2026-08-15 at a 202-commit gap, one variable changed, no `--force`:
      # depth 1 -> `ahead = 95`, `! [rejected] (non-fast-forward)`; depth 0 -> `ahead = 202`,
      # `51c561c0..c3274005  origin/dev -> sit` accepted. `adr-access-model-gate.yml` in this same
      # repo already pins `fetch-depth: 0` for the same class of reason.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # See the twin step in OBRS-backend for the full reasoning. Short version: the cron says
      # when to start, this says whether we are still inside the window. GitHub's cron is
      # best-effort and has been measured 49-83 minutes late on this account. `10#` forces base 10
      # so that "08"/"09" are not parsed as invalid octal.
      - name: Refuse to promote outside the ICT night window
        if: ${{ !inputs.ignore_window }}
        run: |
          set -euo pipefail
          utc_hour=$(date -u +%H)
          ict_hour=$(( (10#${utc_hour} + 7) % 24 ))
          echo "UTC hour ${utc_hour} + 7 (ICT, no DST) = ICT hour ${ict_hour}"
          if [ "${ict_hour}" -gt 3 ]; then
            echo "::error::ICT hour is ${ict_hour}:xx - outside the 00:00-03:59 night window. Refusing to promote: Netlify publishes this ref automatically and SIT has live human users during the day. Re-run manually with ignore_window=true to override."
            exit 1
          fi
          echo "Inside the night window."

      - name: Fetch dev and sit
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/dev:refs/remotes/origin/dev" \
            "+refs/heads/sit:refs/remotes/origin/sit"

      - name: Decide whether there is anything to promote
        id: gap
        run: |
          set -euo pipefail
          ahead=$(git rev-list --count refs/remotes/origin/sit..refs/remotes/origin/dev)
          sha=$(git rev-parse refs/remotes/origin/dev)
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sit..dev = ${ahead} commit(s); dev is at ${sha}"
          if [ "${ahead}" -eq 0 ]; then
            echo "### Nothing to promote - sit already matches dev" >> "$GITHUB_STEP_SUMMARY"
          else
            git log --oneline "refs/remotes/origin/sit..refs/remotes/origin/dev" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The backend gets its verdict for free: promoting there dispatches ci.yml on sit, and the
      # Koyeb deploy job only runs if the whole matrix went green first. Netlify grants no such
      # favour - it watches the git ref and publishes whatever lands there, so on this side the
      # ONLY thing standing between a broken dev and the owner's screen is this step.
      #
      # ci.yml here runs on `push: [dev]`, so the tip of dev always has a verdict of its own. This
      # asserts that verdict belongs to the exact commit being promoted: a run whose headSha is an
      # older commit is evidence about a tree nobody is shipping. Absent, queued, in-progress and
      # failed all refuse - the safe answer to "no evidence" is "do not publish".
      - name: Refuse to promote unless dev's own CI is green
        if: steps.gap.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED_SHA: ${{ steps.gap.outputs.sha }}
        run: |
          set -euo pipefail
          verdict=$(gh run list --workflow=ci.yml --branch=dev --limit 20 \
            --json databaseId,headSha,status,conclusion \
            --jq "map(select(.headSha == \"${PROMOTED_SHA}\")) | .[0] // empty")
          if [ -z "${verdict}" ]; then
            echo "::error::No ci.yml run found on dev for ${PROMOTED_SHA}. Netlify would publish this commit to real users with nothing having tested it. Refusing."
            exit 1
          fi
          status=$(printf '%s' "${verdict}" | jq -r '.status')
          conclusion=$(printf '%s' "${verdict}" | jq -r '.conclusion')
          run_id=$(printf '%s' "${verdict}" | jq -r '.databaseId')
          echo "dev CI run ${run_id}: status=${status} conclusion=${conclusion}"
          if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
            echo "::error::dev CI run ${run_id} for ${PROMOTED_SHA} is status=${status} conclusion=${conclusion}, not a completed success. Refusing to publish."
            exit 1
          fi
          echo "dev is green at ${PROMOTED_SHA} (run ${run_id})."

      # Plain, non-forced. A diverged sit fails loudly here instead of being rewritten; sit is what
      # SIT is serving and force-pushing it is banned.
      #
      # This push is made with GITHUB_TOKEN, so per GitHub's loop prevention it triggers no
      # workflow - which is fine and in fact wanted here: the gate above has already read dev's
      # verdict for this exact tree, and re-running the same suite on the same commit would only
      # spend runner minutes. Netlify is not subject to that prevention; it watches the ref and
      # builds and publishes on its own, in ~40 s.
      - name: Push dev to sit
        if: steps.gap.outputs.ahead != '0'
        run: |
          set -euo pipefail
          git push origin "refs/remotes/origin/dev:refs/heads/sit"
          {
            echo ""
            echo "Pushed \`${{ steps.gap.outputs.sha }}\` to sit. Netlify builds and publishes automatically (~40 s)."
          } >> "$GITHUB_STEP_SUMMARY"

      # OBRS-1067. Every refusal above ends in `exit 1`, which turns the run red and stops there -
      # and a red run nobody opens is indistinguishable from a promote that was never needed. The
      # case that motivated this is the window guard itself: GitHub's cron is best-effort and fired
      # 76 min late on the first unattended run (18:15:56Z measured, against a 17:00Z schedule), and
      # the guard refuses above ICT hour 3, so the last instant it still permits is 03:59:59 ICT -
      # 2 h 44 min of further lateness away. Exhausting that margin is SAFE, because nothing gets
      # published in daylight, and INVISIBLE, because SIT simply keeps serving last week's build
      # and nothing anywhere says so. This step makes it visible WITHOUT moving the window: the
      # ceiling, the cron and the two-nights-a-week cadence are all untouched by this card.
      #
      # A GitHub issue rather than mail, SMS or a Jira comment because it needs NO new credential -
      # GITHUB_TOKEN plus `issues: write` is the entire dependency, so there is nothing to store,
      # scope or rotate. The @-mention is what carries it: it notifies under GitHub's DEFAULT
      # "Participating and @mentions" setting, so the alert does not quietly depend on anyone
      # having the repo on "All Activity".
      #
      # Matched by reading the open list and comparing titles EXACTLY, not via `gh issue list
      # --search`: that index is eventually consistent, and a failure that repeats promptly would
      # be handed an empty result and open a duplicate.
      - name: Report a failed promote where a person will see it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          utc_hour=$(date -u +%H)
          ict_hour=$(( (10#${utc_hour} + 7) % 24 ))
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n' \
            "@${GITHUB_REPOSITORY_OWNER} the ${GITHUB_EVENT_NAME} promote of dev to sit did not complete." \
            "" \
            "- run: ${run_url}" \
            "- this attempt ran at ${utc_hour}:xx UTC = ICT hour ${ict_hour}; the night window closes after ICT hour 3" \
            "" \
            "If the night-window guard refused, nothing was published and nothing is broken: this week's promote was skipped and sit is still serving the previous build. If a step after the push failed, open the run - sit may already have moved." \
            "" \
            "The next promote that completes closes this issue automatically.")
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${REPORT_TITLE}\")) | .[0].number // empty")
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Added a comment to the open report #${existing}."
          else
            gh issue create --title "${REPORT_TITLE}" --body "${body}"
          fi

      # The report is a FLAG, not a log. Left open after the next promote succeeds it would train
      # the reader to ignore it, so a promote that completes clears it and records which run did.
      #
      # `continue-on-error` deliberately: by the time this runs the push has already happened and
      # Netlify is already publishing. If this bookkeeping call failed and took the job down with
      # it, the run would read red for a promote that actually succeeded, and the reader would go
      # hunting for a breakage that does not exist. An annotation is the correct severity here.
      - name: Clear the failure report after a promote that completed
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${REPORT_TITLE}\")) | .[0].number // empty")
          if [ -z "${existing}" ]; then
            echo "No open failure report to clear."
            exit 0
          fi
          gh issue comment "${existing}" --body "Closed by a promote that completed: ${run_url}"
          gh issue close "${existing}"
          echo "Closed the report #${existing}."
