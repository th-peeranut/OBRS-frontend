name: Promote dev to sit (release window)

# OBRS-1042, re-scoped by OBRS-1472 (owner decision 2026-08-20). The frontend is the half that
# actually breaks in a live user's face. The sit build uses `outputHashing: "all"` with no service
# worker, and `src/` contains ZERO ChunkLoadError handlers across 26 lazy routes - so the moment a
# new deploy is published, an already-open tab 404s on its next lazy chunk and shows nothing a
# non-IT user could act on.
#
# None of that changed. WHO is in front of it did: the owner moved staff off SIT and onto prod on
# 2026-08-20, so this window no longer shields SIT's users - it holds the promote inside the
# release slot, ahead of the prod deploy that follows it the same night. The blank-tab mechanism
# followed the users to prod, where the open tab now belongs to a customer mid-payment and there
# is no window at all; OBRS-1164 owns that and this card does not touch it.
#
# Netlify publishes AUTOMATICALLY from `sit` ("Deploys from sit are published automatically",
# confirmed 2026-08-04), completing in ~40 s. There is no build-then-publish split to hide behind:
# pushing this ref IS publishing to the people using it.
#
# WHY THIS FILE LIVES ON `main`: GitHub fires `schedule` and `workflow_dispatch` only from the
# workflow file on the DEFAULT branch. It pins no versions and builds nothing, so unlike ci.yml it
# has nothing that can rot out of sync with dev.

on:
  # THERE IS NO `schedule:` HERE, AND ITS ABSENCE IS THE POINT (OBRS-1472). A cron fired this at
  # 00:00 ICT Tue/Thu to buy SIT a soak with real staff on it. The owner moved those staff to prod
  # on 2026-08-20, so the soak stopped proving anything ci.yml had not already proved - while
  # still gating prod behind it, and while spending a measured 15 Netlify credits per publish on
  # a site with nobody on it.
  #
  # The promote is now a step a person runs inside the release slot: Mon and Wed 21:00 ICT,
  # `dev` -> `sit`, wait for CI to go green on `sit`, then `sit` -> `main` and out to the VM.
  # Do not re-add a cron without re-answering "who is on SIT to notice?".
  # Full procedure and the pre-flight: OBRS-backend `deploy/prod/README.md`.
  workflow_dispatch:
    inputs:
      ignore_window:
        description: 'Bypass the ICT release-window guard (rehearsal only - will publish NOW)'
        type: boolean
        default: false

permissions:
  contents: write  # push origin/dev -> sit
  actions: read    # read dev's CI verdict
  issues: write    # OBRS-1067: file a refusal where a person will see it

concurrency:
  group: promote-sit
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev to sit
    runs-on: ubuntu-latest
    # OBRS-1453: 10 was enough while the green-CI gate took one reading and left. It now waits up
    # to 40 minutes for dev's verdict, and a job killed by its OWN timeout is `cancelled`, not
    # `failure` - so the `if: failure()` report at the bottom would not run and the skipped promote
    # would go silent again, which is the exact outcome OBRS-1067 exists to prevent. 50 = that
    # 40-minute ceiling plus the checkout, fetch and push around it.
    timeout-minutes: 50
    # OBRS-1067. Declared once at job level on purpose: the reporting step and the clearing step
    # find each other by EXACT title, so if the two literals ever drifted by one character the
    # clear would stop matching and every failure would open a fresh issue forever.
    env:
      REPORT_TITLE: 'promote-sit: the scheduled SIT promote did not complete'
    steps:
      # OBRS-1359. `fetch-depth: 0` is LOAD-BEARING - do not "tidy" it back to the default.
      #
      # The default is `fetch-depth: 1`, which runs `git fetch --depth=1 origin refs/heads/main*`
      # and writes main's tip into `.git/shallow`, where git treats it as a commit WITH NO PARENTS.
      # The `Fetch dev and sit` step below inherits that boundary, so any history lying under
      # main's tip is never downloaded - and on THIS repo main's tip is NOT an ancestor of sit:
      # measured 2026-08-15, `sit..main = 108` (main is 108 commits past sit; `main..sit` was 0
      # too, but that is not the operative half - see below). So `sit` is invisible on the runner,
      # git cannot see it on dev's ancestry, and the push
      # is refused CLIENT-SIDE with `non-fast-forward` - without GitHub ever being asked. That is
      # why the API answers `ahead_by:167, behind_by:0` for the same two refs in the same minute.
      #
      # It also silently corrupted the gap count: run 31824419279 printed `sit..dev = 60` when the
      # true value was 167 (= `main..dev` 59, plus the grafted main tip itself). A wrong count is
      # worse than a red run - had it truncated to 0, `Decide whether there is anything to promote`
      # would have reported "nothing to promote" and the run would have gone GREEN while sit stayed
      # 167 commits behind.
      #
      # OBRS-backend's twin file is byte-identical here and pushed fine the same night, which is
      # what makes this look like it cannot be the checkout. It is: over there main's tip WAS an
      # ancestor of sit (`sit..main = 0`, measured on that night's main d7f56576 against sit), so
      # the graft sat at or below sit and cut nothing on dev's path.
      #
      # So the variable is `sit..main > 0` - whether main has DIVERGED from sit - not the
      # workflow, not the size of the gap, and NOT `main..sit`. While main's tip is an ancestor
      # of sit, including main == sit exactly, the graft lands at or below sit and cuts nothing,
      # which makes a sit -> main promote safe; what arms this is a commit reaching `main`
      # without going through `sit`. OBRS-1408: this paragraph used to name `main..sit = 0` as
      # the trigger and cite a `main..sit = 75` on the backend that no counting method
      # reproduces. Isolated on a fixture in OBRS-1377 AC-2 (`sit..main = 160`, true
      # `sit..dev = 163`): depth 1 counted 4 and was rejected, depth 0 counted 163 and pushed;
      # while against the real origin with main == sit, depth 1 counted correctly and pushed.
      #
      # Proven off-runner on 2026-08-15 at a 202-commit gap, one variable changed, no `--force`:
      # depth 1 -> `ahead = 95`, `! [rejected] (non-fast-forward)`; depth 0 -> `ahead = 202`,
      # `51c561c0..c3274005  origin/dev -> sit` accepted. `adr-access-model-gate.yml` in this same
      # repo already pins `fetch-depth: 0` for the same class of reason.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # See the twin step in OBRS-backend for the full reasoning. Short version (OBRS-1472): the
      # window moved from 00:00-03:59 to 20:00-21:59 ICT and stopped being about SIT's users, who
      # are on prod now. It holds the promote inside the release slot so that what comes after it
      # - CI on `sit`, `sit` -> `main`, the VM deploy - still fits before the owner's machine, the
      # only one that can roll any of it back, shuts down at 22:30 ICT.
      # `10#` forces base 10 so that "08"/"09" are not parsed as invalid octal.
      - name: Refuse to promote outside the ICT release window
        if: ${{ !inputs.ignore_window }}
        run: |
          set -euo pipefail
          utc_hour=$(date -u +%H)
          ict_hour=$(( (10#${utc_hour} + 7) % 24 ))
          echo "UTC hour ${utc_hour} + 7 (ICT, no DST) = ICT hour ${ict_hour}"
          if [ "${ict_hour}" -lt 20 ] || [ "${ict_hour}" -gt 21 ]; then
            echo "::error::ICT hour is ${ict_hour}:xx - outside the 20:00-21:59 release window. Refusing to promote: Netlify publishes this ref automatically, and what follows this promote has to finish before the owner's machine shuts down at 22:30 ICT. Re-run manually with ignore_window=true to override."
            exit 1
          fi
          echo "Inside the release window."

      - name: Fetch dev and sit
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/dev:refs/remotes/origin/dev" \
            "+refs/heads/sit:refs/remotes/origin/sit"

      - name: Decide whether there is anything to promote
        id: gap
        run: |
          set -euo pipefail
          ahead=$(git rev-list --count refs/remotes/origin/sit..refs/remotes/origin/dev)
          sha=$(git rev-parse refs/remotes/origin/dev)
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sit..dev = ${ahead} commit(s); dev is at ${sha}"
          if [ "${ahead}" -eq 0 ]; then
            echo "### Nothing to promote - sit already matches dev" >> "$GITHUB_STEP_SUMMARY"
          else
            git log --oneline "refs/remotes/origin/sit..refs/remotes/origin/dev" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The backend gets its verdict for free: promoting there dispatches ci.yml on sit, and the
      # Koyeb deploy job only runs if the whole matrix went green first. Netlify grants no such
      # favour - it watches the git ref and publishes whatever lands there, so on this side the
      # ONLY thing standing between a broken dev and the owner's screen is this step.
      #
      # ci.yml here runs on `push: [dev]`, so the tip of dev always has a verdict of its own. This
      # asserts that verdict belongs to the exact commit being promoted: a run whose headSha is an
      # older commit is evidence about a tree nobody is shipping. Absent, queued, in-progress and
      # failed all refuse - the safe answer to "no evidence" is "do not publish".
      # OBRS-1453. The verdict is now read repeatedly instead of once, and NOTHING about what
      # counts as green moved: absent, queued, in_progress and a non-success conclusion all still
      # refuse, and only a `completed` + `success` belonging to this exact sha passes. Waiting for
      # an answer is not the same as accepting a worse one - AC-3 forbids the second, not the first.
      #
      # Why the single reading was not enough. On 2026-08-19 this step refused with
      # `status=in_progress` and the round was discarded. The cause was NOT the cron crowding a
      # merge - measured, the merge (15:45:25Z) and the cron (17:20:29Z) were 1h35m apart. dev's
      # `Install Playwright Chromium` had hung and ran 6h00m40s before GitHub's own 360-minute
      # default killed it; ci.yml at that commit carried no `timeout-minutes` at all.
      #
      # The ceiling below is DERIVED from the cap that OBRS-1442 has since put on that same job:
      # 35 minutes worst case for dev's E2E lane, plus 5 for queueing. Measured healthy range for
      # comparison: 15m08s-17m16s across 11 consecutive dev runs. So a wait that reaches the
      # ceiling means dev CI hit its own cap, not that this number is too small.
      #
      # The wait may never outlive the release window. The guard above reads the hour only at
      # START, so without this clamp a promote admitted at 21:59 ICT could still publish at 22:39.
      # OBRS-1472 moved the clamp with the window: 15:00:00Z = 22:00 ICT, the instant the window
      # shuts and half an hour before the machine that could roll this back goes off. Leaving it at
      # the old 21:00:00Z would not have failed LOUDLY - it would have gone DEAD: from a 21:00 ICT
      # (14:00Z) start, 21:00Z is seven hours out, so the 40-minute poll ceiling always wins and
      # the window stops bounding the wait at all. Simulated both values at a 14:00Z start before
      # changing it: old = never clamps, new = does not clamp either at 21:00 (14:40Z deadline
      # fits) and does clamp from about 21:20 ICT onward, which is the behaviour wanted.
      # `ignore_window` lifts the clamp for the same reason it lifts the guard: somebody asked for
      # it deliberately and is watching.
      - name: Refuse to promote unless dev's own CI is green
        if: steps.gap.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED_SHA: ${{ steps.gap.outputs.sha }}
          WINDOW_ENFORCED: ${{ !inputs.ignore_window }}
          POLL_MINUTES: '40'
        run: |
          set -euo pipefail
          deadline=$(( $(date -u +%s) + POLL_MINUTES * 60 ))
          window_close=$(TZ=UTC date -d 'today 15:00' +%s)   # 22:00 ICT - the window's close
          if [ "${WINDOW_ENFORCED}" = 'true' ] && [ "${window_close}" -lt "${deadline}" ]; then
            deadline=${window_close}
            echo "Deadline clamped to the release window: $(TZ=UTC date -d "@${deadline}" -Iseconds)"
          else
            echo "Deadline is the ${POLL_MINUTES}-minute poll ceiling: $(TZ=UTC date -d "@${deadline}" -Iseconds)"
          fi
          # `.[0]` is the MOST RECENT run for this sha, so a re-run started while we wait is what
          # gets read - the same choice the single-reading version made, just taken later.
          while : ; do
            verdict=$(gh run list --workflow=ci.yml --branch=dev --limit 20 \
              --json databaseId,headSha,status,conclusion \
              --jq "map(select(.headSha == \"${PROMOTED_SHA}\")) | .[0] // empty")
            if [ -z "${verdict}" ]; then
              # Absent is waited on rather than refused outright: GitHub takes a moment to create
              # the run after a push, and a promote that arrives inside that moment used to lose
              # its whole round to a race it could simply have outlasted. It still refuses at the
              # deadline - "no evidence" is never a pass.
              status='absent'; conclusion=''; run_id='-'
            else
              status=$(printf '%s' "${verdict}" | jq -r '.status')
              conclusion=$(printf '%s' "${verdict}" | jq -r '.conclusion')
              run_id=$(printf '%s' "${verdict}" | jq -r '.databaseId')
            fi
            echo "$(date -u +%H:%M:%SZ) dev CI run ${run_id}: status=${status} conclusion=${conclusion}"
            if [ "${status}" = 'completed' ]; then
              break
            fi
            if [ "$(date -u +%s)" -ge "${deadline}" ]; then
              echo "::error::Waited for dev CI on ${PROMOTED_SHA} until $(TZ=UTC date -d "@${deadline}" -Iseconds) and it is still status=${status}. Netlify would publish a commit with no verdict. Refusing."
              exit 1
            fi
            sleep 30
          done
          if [ "${conclusion}" != 'success' ]; then
            echo "::error::dev CI run ${run_id} for ${PROMOTED_SHA} completed with conclusion=${conclusion}, not success. Refusing to publish."
            exit 1
          fi
          echo "dev is green at ${PROMOTED_SHA} (run ${run_id})."

      # Plain, non-forced. A diverged sit fails loudly here instead of being rewritten; sit is what
      # SIT is serving and force-pushing it is banned.
      #
      # This push is made with GITHUB_TOKEN, so per GitHub's loop prevention it triggers no
      # workflow - which is fine and in fact wanted here: the gate above has already read dev's
      # verdict for this exact tree, and re-running the same suite on the same commit would only
      # spend runner minutes. Netlify is not subject to that prevention; it watches the ref and
      # builds and publishes on its own, in ~40 s.
      - name: Push dev to sit
        if: steps.gap.outputs.ahead != '0'
        run: |
          set -euo pipefail
          git push origin "refs/remotes/origin/dev:refs/heads/sit"
          {
            echo ""
            echo "Pushed \`${{ steps.gap.outputs.sha }}\` to sit. Netlify builds and publishes automatically (~40 s)."
          } >> "$GITHUB_STEP_SUMMARY"

      # OBRS-1067. Every refusal above ends in `exit 1`, which turns the run red and stops there -
      # and a red run nobody opens is indistinguishable from a promote that was never needed. The
      # case that motivated this was the window guard itself: GitHub's cron was best-effort and
      # fired 76 min late on the first unattended run (18:15:56Z measured, against a 17:00Z
      # schedule), so a run could arrive past the ceiling and refuse. That was SAFE - nothing got
      # published - and INVISIBLE, because SIT simply kept serving last week's build and nothing
      # anywhere said so.
      #
      # OBRS-1472 removed the cron and moved the window to 20:00-21:59 ICT, which retires the
      # lateness half: a human dispatches this now and is present to read a refusal. Every OTHER
      # refusal above is unchanged and still silent on its own - a red dev, a verdict belonging to
      # the wrong sha, a divergent sit - which is what this step is now for.
      #
      # A GitHub issue rather than mail, SMS or a Jira comment because it needs NO new credential -
      # GITHUB_TOKEN plus `issues: write` is the entire dependency, so there is nothing to store,
      # scope or rotate. The @-mention is what carries it: it notifies under GitHub's DEFAULT
      # "Participating and @mentions" setting, so the alert does not quietly depend on anyone
      # having the repo on "All Activity".
      #
      # Matched by reading the open list and comparing titles EXACTLY, not via `gh issue list
      # --search`: that index is eventually consistent, and a failure that repeats promptly would
      # be handed an empty result and open a duplicate.
      #
      # OBRS-1453 AC-5. The report said a promote had failed but never how far behind that left
      # SIT, so the one number that says whether this matters was the one nobody had: issue #257
      # sat open with zero comments while `sit..dev` went from 45 to 64 in a single afternoon.
      # `steps.gap.outputs.ahead` is empty when the run stopped before the gap was counted (the
      # window guard refuses above it), so the fallback says that rather than printing a bare 0.
      - name: Report a failed promote where a person will see it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAP_AHEAD: ${{ steps.gap.outputs.ahead || 'not counted - this attempt stopped before the gap step' }}
        run: |
          set -euo pipefail
          utc_hour=$(date -u +%H)
          ict_hour=$(( (10#${utc_hour} + 7) % 24 ))
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n' \
            "@${GITHUB_REPOSITORY_OWNER} the ${GITHUB_EVENT_NAME} promote of dev to sit did not complete." \
            "" \
            "- run: ${run_url}" \
            "- this attempt ran at ${utc_hour}:xx UTC = ICT hour ${ict_hour}; the release window is ICT 20:00-21:59" \
            "- \`sit..dev\` at this attempt: **${GAP_AHEAD}** commit(s) - that is how far behind SIT stays until a promote completes" \
            "" \
            "If the release-window guard refused, nothing was published and nothing is broken: this promote was skipped and sit is still serving the previous build. If a step after the push failed, open the run - sit may already have moved." \
            "" \
            "The next promote that completes closes this issue automatically.")
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${REPORT_TITLE}\")) | .[0].number // empty")
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Added a comment to the open report #${existing}."
          else
            gh issue create --title "${REPORT_TITLE}" --body "${body}"
          fi

      # The report is a FLAG, not a log. Left open after the next promote succeeds it would train
      # the reader to ignore it, so a promote that completes clears it and records which run did.
      #
      # `continue-on-error` deliberately: by the time this runs the push has already happened and
      # Netlify is already publishing. If this bookkeeping call failed and took the job down with
      # it, the run would read red for a promote that actually succeeded, and the reader would go
      # hunting for a breakage that does not exist. An annotation is the correct severity here.
      - name: Clear the failure report after a promote that completed
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${REPORT_TITLE}\")) | .[0].number // empty")
          if [ -z "${existing}" ]; then
            echo "No open failure report to clear."
            exit 0
          fi
          gh issue comment "${existing}" --body "Closed by a promote that completed: ${run_url}"
          gh issue close "${existing}"
          echo "Closed the report #${existing}."
