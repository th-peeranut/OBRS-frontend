# OBRS-911. `sit` is this site's PRODUCTION branch, and Netlify bills the successful
# production deploy — measured 2026-08-10 on the Usage & billing page, 195 credits for 13
# deploys, i.e. 15.0 each, matching the 105/7 measured in a different billing period on
# 2026-07-30. The price of a push is therefore the same whether it moved a bundle byte or a
# paragraph of prose, and promotes in this repo's history have moved nothing but `e2e/`,
# `docs/` and `*.spec.ts`.
#
# `ignore` is Netlify's own hook for exactly that, and its polarity is the opposite of a
# test: exit 0 CANCELS the build, non-zero builds. The decision lives in a script rather
# than a shell one-liner here because it has to be provable — scripts/check-netlify-
# ignore.mjs runs it against fixed path lists on every CI run. A wrong skip is silent: no
# build log, no failed check, nothing red, and `sit` keeps serving the previous bundle
# while the push reads as deployed.
#
# ⚠️ `command` must stay byte-identical. The value in the Netlify UI is a DIFFERENT string
# (`npm run build:sit`) that never runs scripts/inject-sit-env.js, so the gitignored
# environment.local.ts is never generated and `prebuild:sit --require-local` fails. Drop
# this key and the site falls back to that one — failing on the NEXT build, not on the edit
# that caused it. check-netlify-ignore.mjs asserts this exact line.
[build]
  command = "node scripts/inject-sit-env.js && npm run build -- --configuration sit"
  publish = "dist/obrs/browser"
  ignore = "node scripts/netlify-ignore.mjs"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# OBRS-719 (PCI DSS 6.4.3 / 11.6.1) — SIT is where this policy finally gets MEASURED.
#
# Until this block SIT sent no security headers at all, so the CSP that
# OBRS-backend/deploy/prod/Caddyfile serves had never been read by a browser anywhere:
# prod carries the header today, but the Angular app is not published to that VM yet
# (`/` answered 404 on 2026-07-28), and Netlify sent nothing. Every origin in the
# allowlist is therefore still derived from reading source — exactly the kind of policy
# that discovers it is wrong on the page that takes card payments.
#
# So this is deliberately the SAME policy as prod's, and Report-Only for the same
# reason: it blocks nothing while we find out what it would have blocked.
#
# What is and is NOT gated, stated exactly: scripts/check-payment-page-scripts.mjs checks
# THIS header against scripts/payment-page-script-inventory.json, and the backend's
# CspAllowlistMatchesInventoryTest checks the Caddyfile against the prose inventory beside
# it. Neither repo can read the other's tree, so nothing mechanically compares SIT's policy
# to prod's — keeping the two in step is a human step, and the prose inventory is the seam.
#
# Two differences from the prod header, both forced by where SIT lives:
#   - `report-uri` is absolute and cross-origin. On prod, Caddy fronts both the app and
#     the API, so /api/csp-report is same-origin; on SIT the app is on Netlify and the
#     API on Koyeb. Violation reports are not CORS-preflighted, so this reaches the
#     collector — and the collector caps body size and rate-limits per IP precisely
#     because it takes POSTs from hosts it does not control.
#   - `connect-src` / `wss:` name the Koyeb backend instead of nj-phuyaipu.com, same
#     split-origin reason. Nothing else differs.
#
# `img-src https://api.maptiler.com` is here for the same reason it is in the prod
# Caddyfile (OBRS-833): both map surfaces use Leaflet RASTER tiles, so a tile is an
# `<img>` and is governed by img-src, not connect-src. It matters more on SIT than it
# looks — this is the surface where violations are actually collected, so leaving it out
# would fill the collector with false positives from every tile and bury the real ones.
#
# `img-src https://hkupaujkdvdrqmtifgsm.supabase.co` is SIT's Supabase Storage project,
# where the screenshots customers attach to usability reports live. The backend returns
# an absolute `https://<project-ref>.supabase.co/storage/v1/object/public/…` URL and four
# surfaces bind it straight into `<img [src]>`: the admin report detail modal and its
# lightbox, the customer "My reports" modal, the shared follow-up timeline, and the edit
# form's preview of already-uploaded images. `img-src`, not `connect-src` — nothing
# fetches these over XHR — and a named host, not `https://*.supabase.co`, which would
# trust every Supabase project on the internet.
#   ⚠️ This ref is SIT's and differs from prod's, so the two policies do NOT carry the
#   same string here. Copying prod's ref over would allowlist an origin SIT never loads
#   while still blocking the one it does — and Report-Only means SIT would show no symptom
#   at all, which is why check-payment-page-scripts.mjs rejects prod's ref by name.
#   What the value rests on, in order of weight: it was MEASURED to exist —
#   `GET https://<ref>.supabase.co/storage/v1/bucket` answers 400, i.e. storage-api
#   replying, while an invented ref does not resolve at all — and it was read off
#   `application-sit.yml`'s pooler username (`postgres.hkupaujkdvdrqmtifgsm`), the same
#   route OBRS-206 took for prod before confirming it on the VM.
#   ⛔ Only the REF travels that way, never the whole host. `application-prod.yml` says in
#   its own comment (OBRS-401/429) that the pooler HOSTNAME was copied verbatim from the
#   dashboard and must not be derived, because Supabase assigns the region prefix per
#   project. Storage is `<ref>.supabase.co` — no region in it — which is why the ref alone
#   is enough here and is not a licence to guess the database host.
#   This entry exists because prod shipped without it. Report-Only hid the gap on both
#   environments until OBRS-719 AC 5 made prod's header enforcing, and every one of those
#   thumbnails became a broken-image icon the same day (OBRS-1311). None of the four
#   surfaces is on the booking→payment journey, so no amount of draining that journey's
#   violations would have found it.
#
# The analytics origins (OBRS-882, for the tags OBRS-867 added) are here for that exact
# reason, restated because it is the one that got missed: OBRS-867 shipped two script
# loaders and touched no CSP, on the strength of a comment in
# analytics-tags.service.ts asserting this repo served no CSP header. It had served one
# since the day before. Report-Only makes that kind of miss cost nothing visible — the
# tags still load — while every page view POSTs violations to the collector whose
# documented steady state is ZERO lines, which is where the maptiler entry above came
# from too. Split by directive, and each one chosen from what the vendor does, not
# guessed from the script URL:
#   - `script-src` www.googletagmanager.com + www.clarity.ms + scripts.clarity.ms — the
#     two tags, and the host the second one REDIRECTS ITS WORK TO. Explicit hosts, not
#     wildcards: script-src is the directive where a wildcard actually widens trust, and
#     that stays true now that three names are needed instead of two.
#   - `connect-src` *.google-analytics.com + *.analytics.google.com — gtag's hit
#     endpoints, which are region-sharded (`region1.` and friends), so a bare host would
#     be wrong for most visitors rather than for none. *.clarity.ms — Clarity uploads
#     recordings to a subdomain it picks per session; measured, that upload is
#     `y.clarity.ms/collect` over XHR, so this wildcard is the entry carrying it.
#   - `img-src` *.google-analytics.com — gtag falls back to an image beacon when
#     sendBeacon and fetch are both unavailable. Cheap to allow, silent to omit.
#     c.clarity.ms + c.bing.com — Clarity's cookie-sync beacon and the host it 302s to.
#
# OBRS-882 wrote the set above from vendor documentation and said so; OBRS-888 is what
# happened when SIT finally published with the IDs configured and it could be MEASURED.
# Two entries were wrong, each in a way reading the source could not catch:
#   - `www.clarity.ms/tag/<id>` is a BOOTSTRAP LOADER. The code it runs comes from
#     `scripts.clarity.ms/<ver>/clarity.js`, a host this repo's source never names — so
#     no grep of the loader, and no rule comparing a loader to its inventory entry, could
#     ever have produced it. Only a browser could.
#   - `c.clarity.ms/c.gif` 302s to `c.bing.com/c.gif`, and CSP re-checks EVERY hop of a
#     redirect. Allowing only the first host was measured under a real ENFORCING header
#     and the image still failed. The trap is the report: CSP names the PRE-redirect URL,
#     so a denial at hop 2 arrives as `img-src <- c.clarity.ms` — the host that IS
#     allowed — byte-identical to a denial at hop 1. Do NOT delete `c.bing.com` because
#     the collector never mentions it; the collector is structurally unable to mention
#     it. scripts/check-payment-page-scripts.mjs now fails the build on that edit.
# ⚠️ Still not a fully drained log: this covers `/` and `/login`. Draining the consented
# booking→payment journey is OBRS-867 AC-6 and remains a hard prerequisite for
# OBRS-719 AC 5 — a missing origin is invisible in Report-Only and fatal the moment this
# becomes `Content-Security-Policy`.
#
# `style-src https://accounts.google.com` (OBRS-889) is the third measured entry, and it
# is the one that shows an origin can be in the allowlist and still be denied. GIS was
# already allowed in `script-src`, `connect-src` and `frame-src`; what nothing named is
# that `gsi/client` then injects a <link> to `https://accounts.google.com/gsi/style` INTO
# THIS DOCUMENT. There is no `style-src-elem` here, so that load falls back to `style-src`
# — which listed fonts.googleapis.com and nothing else — and under a real enforcing header
# the stylesheet is dropped with `error: csp`. Measured on published SIT by serving this
# exact policy as `Content-Security-Policy` via a request interceptor: 1 violation before,
# 0 after, no other directive involved and no redirect hop anywhere in the request set.
#   ⚠️ What the violation does NOT do, also measured, because the card assumed it did: the
#   sign-in BUTTON does not break. It is rendered by `accounts.google.com/gsi/button` in a
#   cross-origin iframe that `frame-src` already allows, so its pixels come from inside
#   that iframe and our policy never touches them — button screenshots are byte-identical
#   with the sheet allowed and blocked, and the sign-in popup opens either way. The cost
#   is the collector: PCI DSS 11.6.1's documented steady state here is ZERO lines, and
#   this wrote one per /login view. The next GIS surface rendered in our own document (One
#   Tap, which this app does not use today) is where it would also become visible.
#   Named host, no wildcard — same rule as script-src above, for the same reason.
#
# ⚠️ Do NOT rename this to the enforcing `Content-Security-Policy` here as a shortcut to
# "we tested it". SIT and prod serve different origins, so enforceable on SIT is not
# proof for prod. The enforce flip is OBRS-719 AC 5 and belongs on the VM, after a real
# booking→payment journey there.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://accounts.google.com https://maps.googleapis.com https://cdn.omise.co https://*.gstatic.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://api.maptiler.com https://*.google-analytics.com https://c.clarity.ms https://c.bing.com https://hkupaujkdvdrqmtifgsm.supabase.co https://api.omise.co https://omise-gateway-production.s3.ap-southeast-1.amazonaws.com; connect-src 'self' https://sit-obrs-backend.koyeb.app https://api.omise.co https://vault.omise.co https://maps.googleapis.com https://accounts.google.com wss://sit-obrs-backend.koyeb.app https://*.google-analytics.com https://*.analytics.google.com https://*.clarity.ms; frame-src https://accounts.google.com https://*.omise.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri https://sit-obrs-backend.koyeb.app/api/csp-report"

# Strict-Transport-Security is deliberately NOT set here. SIT is a *.netlify.app
# subdomain and an HSTS header from us binds that host for a year; prod sets it in the
# Caddyfile, where the domain actually is ours.
