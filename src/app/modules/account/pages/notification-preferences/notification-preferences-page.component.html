<app-navbar></app-navbar>

<section class="npref-page">
  <div class="npref-page__inner">
    <header class="npref-page__header">
      <h1>{{ 'NOTIFICATION_PREFS.TITLE' | translate }}</h1>
      <p>{{ 'NOTIFICATION_PREFS.SUBTITLE' | translate }}</p>
    </header>

    @if (isLoading) {
      <div class="npref-page__loading">
        <p-progressSpinner
          styleClass="npref-spinner"
          strokeWidth="4"
          animationDuration=".8s"
        ></p-progressSpinner>
      </div>
    }

    @if (!isLoading && loadFailed) {
      <div class="npref-page__error">
        <p>{{ 'NOTIFICATION_PREFS.ERROR.LOAD_FAILED' | translate }}</p>
        <button type="button" class="npref-retry-btn" (click)="onRetry()">
          {{ 'NOTIFICATION_PREFS.RETRY' | translate }}
        </button>
      </div>
    }

    @if (!isLoading && !loadFailed) {
      <app-notification-preference-matrix
        [preferences]="rows"
        [disabled]="isSaving"
        [warningType]="criticalWarningType"
        (rowChange)="onRowChange($event)"
      ></app-notification-preference-matrix>
      <div class="npref-page__actions">
        <p-button
          styleClass="npref-save-btn"
          [label]="'NOTIFICATION_PREFS.SAVE_BUTTON' | translate"
          [disabled]="!isDirty || isSaving"
          [loading]="isSaving"
          (onClick)="save()"
        ></p-button>
      </div>
    }
  </div>
</section>
