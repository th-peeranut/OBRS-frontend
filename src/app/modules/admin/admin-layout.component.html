<div class="admin-shell theme-admin" [class.is-dark]="isDarkMode" [class.is-sidebar-open]="isSidebarOpen" [class.is-sidebar-pinned]="isSidebarPinned">
  <div
    class="admin-sidebar-backdrop"
    *ngIf="isSidebarOpen"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>

  <aside
    class="admin-sidebar"
    [class.is-open]="isSidebarOpen"
  >
    <div class="admin-sidebar-panel">
      <div class="admin-brand">
        <a
          routerLink="/"
          class="admin-brand-link"
          [attr.aria-label]="'ADMIN.LAYOUT.HOME_LINK' | translate"
          (click)="closeSidebar()"
        >
          <img
            class="admin-brand-logo"
            src="images/logo.svg"
            [attr.alt]="'ADMIN.LAYOUT.BRAND' | translate"
          />
        </a>
      </div>

      <!-- TOGGLE BUTTON — collapses the expanded 280px column to a 76px icon
           rail (or vice-versa) on explicit click. Always visible in both states.
           align-self: controlled by CSS (centred in rail, right-aligned in expanded). -->
      <button
        type="button"
        class="admin-sidebar-pin"
        (click)="togglePin()"
        [attr.aria-expanded]="isSidebarPinned"
        [attr.aria-label]="(isSidebarPinned ? 'ADMIN.LAYOUT.COLLAPSE_MENU' : 'ADMIN.LAYOUT.EXPAND_MENU') | translate"
        [attr.title]="(isSidebarPinned ? 'ADMIN.LAYOUT.COLLAPSE_MENU' : 'ADMIN.LAYOUT.EXPAND_MENU') | translate"
      >
        <span class="material-symbols-outlined">{{ toggleIconName }}</span>
      </button>

      <!-- OBRS-290: sidebar menu search — filters by menu name + description -->
      <div class="admin-nav-search">
        <span class="material-symbols-outlined admin-nav-search-icon" aria-hidden="true">search</span>
        <input
          #navSearchInput
          type="text"
          class="admin-nav-search-input"
          [value]="navSearchQuery"
          (input)="applyNavSearch(navSearchInput.value)"
          (keydown.escape)="clearNavSearch(); navSearchInput.value = ''"
          [attr.placeholder]="'ADMIN.NAV.SEARCH_PLACEHOLDER' | translate"
          [attr.aria-label]="'ADMIN.NAV.SEARCH_PLACEHOLDER' | translate"
          autocomplete="off"
        />
        <button
          *ngIf="navSearchQuery"
          type="button"
          class="admin-nav-search-clear"
          (click)="clearNavSearch(); navSearchInput.value = ''"
          [attr.aria-label]="'ADMIN.NAV.SEARCH_CLEAR_ARIA' | translate"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- OBRS-289: nav grouped into labelled sections (presentational only —
           grouping never changes which items show or their access). -->
      <nav class="admin-nav">
        <ng-container *ngFor="let section of filteredNavSections">
          <p class="admin-nav-section-title">{{ section.titleKey | translate }}</p>
          <!-- OBRS-702: exact matching everywhere except an entry that opts
               into subtree matching, which today is only 'settings' — its page
               lives at /admin/settings/(tab), so an exact match would
               un-highlight the menu on the very page it just opened. -->
          <a
            *ngFor="let item of section.items"
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: !item.matchSubtree }"
            class="admin-nav-link"
            (click)="onNavLinkClick(); clearNavSearch()"
          >
            <span class="material-symbols-outlined">{{ item.icon }}</span>
            <span>{{ item.labelKey | translate }}</span>
            <span
              *ngIf="item.showBadge && badgeCount > 0"
              class="admin-nav-badge"
              [attr.aria-label]="(badgeStatus === 'owner_accepted' ? 'ADMIN.USABILITY_REPORTS.ACCEPTED_BADGE_ARIA' : 'ADMIN.USABILITY_REPORTS.NEW_BADGE_ARIA') | translate: { count: badgeCount }"
            >{{ badgeCount > 99 ? '99+' : badgeCount }}</span>
          </a>
        </ng-container>
        <p *ngIf="navSearchQuery && filteredNavSections.length === 0" class="admin-nav-empty">
          {{ 'ADMIN.NAV.NO_RESULTS' | translate }}
        </p>
      </nav>

      <div class="admin-sidebar-footer">
        <button class="admin-nav-link admin-nav-btn" type="button">
          <span class="material-symbols-outlined">help_outline</span>
          <span>{{ 'ADMIN.LAYOUT.SUPPORT' | translate }}</span>
        </button>
        <button class="admin-nav-link admin-nav-btn" type="button" (click)="onLogout()">
          <span class="material-symbols-outlined">logout</span>
          <span>{{ 'ADMIN.LAYOUT.SIGN_OUT' | translate }}</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button
        type="button"
        class="admin-icon-btn admin-menu-toggle"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="isSidebarOpen"
        [attr.aria-label]="(isSidebarOpen ? 'ADMIN.LAYOUT.CLOSE_MENU' : 'ADMIN.LAYOUT.OPEN_MENU') | translate"
      >
        <span class="material-symbols-outlined">{{ isSidebarOpen ? 'close' : 'menu' }}</span>
      </button>

      <div class="admin-title-block">
        <h2>{{ pageTitleKey | translate }}</h2>
        <p>{{ pageSubtitleKey | translate }}</p>
      </div>

      <div class="admin-topbar-actions">
        <button
          type="button"
          class="admin-icon-btn"
          (click)="toggleTheme()"
          [attr.aria-pressed]="isDarkMode"
          [attr.aria-label]="'ADMIN.LAYOUT.THEME_TOGGLE' | translate"
        >
          <span class="material-symbols-outlined">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
        </button>

        <app-notification-bell shellVariant="admin"></app-notification-bell>

        <app-lang-switcher></app-lang-switcher>

        <div class="admin-profile">
          <button
            class="admin-avatar"
            type="button"
            (click)="toggleProfileMenu()"
            [attr.aria-expanded]="isProfileMenuOpen"
            aria-haspopup="menu"
            [attr.aria-label]="'ADMIN.LAYOUT.PROFILE_MENU' | translate"
          >
            {{ userInitials }}
          </button>
          <div class="admin-profile-menu" *ngIf="isProfileMenuOpen" role="menu">
            <a
              *ngIf="isStaffUser"
              class="admin-profile-item"
              role="menuitem"
              [routerLink]="'/staff'"
              (click)="closeProfileMenu()"
            >
              <span class="material-symbols-outlined">badge</span>
              <span>{{ 'ADMIN.LAYOUT.STAFF_AREA' | translate }}</span>
            </a>
            <button type="button" class="admin-profile-item" role="menuitem" (click)="onLogout()">
              <span class="material-symbols-outlined">logout</span>
              <span>{{ 'ADMIN.LAYOUT.SIGN_OUT' | translate }}</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
