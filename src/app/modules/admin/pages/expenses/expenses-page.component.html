<section class="admin-page-intro">
  <div>
    <!-- OBRS-1356 AC-1: the first half of usability report #4 was literally
    "what is this page for". The page never said. -->
    <p class="admin-muted">{{ 'ADMIN.EXPENSES.PAGE_PURPOSE' | translate }}</p>
    <app-admin-refresh-hint
      [refreshing]="isRefreshing"
      [failed]="refreshFailed"
      [loading]="isLoading"
    ></app-admin-refresh-hint>
  </div>
</section>

<section class="admin-page-filters mt-3">
  <app-admin-dropdown
    [value]="selectedVehicleFilter"
    [options]="vehicleFilterOptions"
    valueKey="code"
    labelKey="label"
    [placeholder]="'ADMIN.EXPENSES.FILTER_VEHICLE' | translate"
    (valueChange)="onVehicleFilterChange($event)"
  ></app-admin-dropdown>

  <app-admin-dropdown
    [value]="selectedCategoryFilter"
    [options]="categoryOptions"
    valueKey="code"
    labelKey="label"
    [placeholder]="'ADMIN.EXPENSES.FILTER_CATEGORY' | translate"
    (valueChange)="onCategoryFilterChange($event)"
  ></app-admin-dropdown>

  <p-datePicker
    styleClass="app-date-field"
    panelStyleClass="app-date-field-panel"
    dateFormat="dd/mm/yy"
    [ngModel]="dateFrom"
    (ngModelChange)="onFromDateChange($event)"
    [showIcon]="true"
    [iconDisplay]="'input'"
    [showButtonBar]="true"
    [placeholder]="'ADMIN.EXPENSES.FILTER_DATE_FROM' | translate"
    >
    <ng-template pTemplate="inputicon">
      <img class="app-date-field-icon" src="icons/calendar.svg" [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate" />
    </ng-template>
  </p-datePicker>

  <p-datePicker
    styleClass="app-date-field"
    panelStyleClass="app-date-field-panel"
    dateFormat="dd/mm/yy"
    [ngModel]="dateTo"
    (ngModelChange)="onToDateChange($event)"
    [showIcon]="true"
    [iconDisplay]="'input'"
    [showButtonBar]="true"
    [placeholder]="'ADMIN.EXPENSES.FILTER_DATE_TO' | translate"
    >
    <ng-template pTemplate="inputicon">
      <img class="app-date-field-icon" src="icons/calendar.svg" [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate" />
    </ng-template>
  </p-datePicker>

  @if (canWrite) {
    <!-- OBRS-1576: two ways in, because there are two things to record. This one is one loose bill;
    `รับซองบิล` beside it is the stack a garage hands over at once. Neither replaces the other — a
    single slip through the envelope page is more clicks, not fewer. -->
    <button
      type="button"
      class="admin-btn admin-btn-primary ms-auto"
      (click)="openCreateModal()"
      >
      <span class="material-symbols-outlined" [attr.translate]="'no'">add</span>
      <span>{{ 'ADMIN.EXPENSES.ADD' | translate }}</span>
    </button>
    <button
      type="button"
      class="admin-btn"
      data-testid="expenses-open-batch"
      routerLink="/admin/expenses/batch"
      >
      <span class="material-symbols-outlined" [attr.translate]="'no'">receipt_long</span>
      <span>{{ 'ADMIN.EXPENSES.BATCH.OPEN' | translate }}</span>
    </button>
  }
</section>

<app-expense-approval-lane
  [rows]="pendingExpenses"
  [busyId]="approvalBusyId"
  (approve)="onApproveExpense($event)"
  (reject)="onRejectExpense($event)"
></app-expense-approval-lane>

<app-expense-list-table
  [rows]="filteredExpenses"
  [isLoading]="isLoading"
  [skeletonRows]="skeletonRows"
  [hasError]="!!errorMessage"
  [errorMessage]="errorMessage"
  [isEmpty]="isEmpty"
  [canWrite]="canWrite"
  [showOwnerColumn]="isAdmin"
  (edit)="openEditModal($event)"
  (delete)="openDeleteModal($event)"
></app-expense-list-table>

<app-expense-form-modal
  [isOpen]="isFormModalOpen"
  [mode]="mode"
  [selectedExpense]="selectedExpense"
  [vehicleOptions]="vehicleOptions"
  [categoryOptions]="categoryOptions"
  [ownerOptions]="ownerOptions"
  [payeeOptions]="payeeOptions"
  [canCreatePayee]="canCreatePayee"
  [isAdmin]="isAdmin"
  [reloadStructure]="reloadStructureBound"
  (closed)="onFormModalClosed()"
  (payeeCreated)="onPayeeCreated()"
></app-expense-form-modal>

<app-expense-delete-modal
  [isOpen]="isDeleteModalOpen"
  [expense]="selectedExpense"
  [isDeleting]="isDeleting"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()"
></app-expense-delete-modal>
