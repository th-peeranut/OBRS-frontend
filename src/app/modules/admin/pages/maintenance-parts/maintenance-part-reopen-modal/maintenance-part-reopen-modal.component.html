@if (isOpen) {
  <div class="admin-modal-backdrop" adminModalBackdrop (dismiss)="cancel.emit()">
    <div class="admin-modal admin-modal-confirm">
      <h4 class="admin-modal-title">{{ 'ADMIN.MAINTENANCE_PARTS.REOPEN_CONFIRM_TITLE' | translate }}</h4>
      <p class="admin-modal-subtitle">
        {{ 'ADMIN.MAINTENANCE_PARTS.REOPEN_CONFIRM_MESSAGE' | translate:{ mergedInto: mergedIntoLabel } }}
        @if (part) {
          <strong data-testid="part-reopen-name">{{ part.name }}</strong>
        }
      </p>
      <div class="admin-modal-actions">
        <button type="button" class="admin-btn" (click)="cancel.emit()">
          {{ 'ADMIN.COMMON.CANCEL' | translate }}
        </button>
        <button
          type="button"
          class="admin-btn admin-btn-primary"
          data-testid="part-reopen-confirm"
          [disabled]="isReopening"
          (click)="confirm.emit()"
          >
          {{ isReopening ? ('ADMIN.MAINTENANCE_PARTS.REOPENING' | translate) : ('ADMIN.MAINTENANCE_PARTS.REOPEN' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
