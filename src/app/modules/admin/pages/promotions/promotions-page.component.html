<app-round-trip-promotion-card></app-round-trip-promotion-card>

<section class="admin-page-intro mt-3">
  <div>
    @if (isLoading) {
      <p class="admin-muted">{{ 'ADMIN.COMMON.LOADING' | translate }}</p>
    }
    @if (errorMessage) {
      <p class="admin-muted">{{ errorMessage }}</p>
    }
    <app-admin-refresh-hint [refreshing]="isRefreshing" [failed]="refreshFailed" [loading]="isLoading"></app-admin-refresh-hint>
  </div>
  <button type="button" class="admin-btn admin-btn-primary" (click)="openCreateModal()">
    <span class="material-symbols-outlined" [attr.translate]="'no'">add</span>
    <span>{{ 'ADMIN.PROMOTIONS.ADD' | translate }}</span>
  </button>
</section>

<app-promotion-list-table
  [rows]="rows"
  [isLoading]="isLoading"
  [skeletonRows]="skeletonRows"
  [hasError]="!!errorMessage"
  (edit)="openEditModal($event)"
  (deactivate)="openDeactivateModal($event)"
></app-promotion-list-table>

<app-promotion-form-modal
  [isOpen]="isFormModalOpen"
  [mode]="mode"
  [selectedPromotion]="selectedPromotion"
  [discountTypeOptions]="discountTypeOptions"
  [statusOptions]="statusOptions"
  [autoApplyOptions]="autoApplyOptions"
  [reloadStructure]="reloadStructureBound"
  (closed)="onFormModalClosed()"
></app-promotion-form-modal>

<app-promotion-deactivate-modal
  [isOpen]="isDeactivateModalOpen"
  [promotion]="selectedPromotion"
  [isDeactivating]="isDeactivating"
  (confirm)="confirmDeactivate()"
  (cancel)="closeDeactivateModal()"
></app-promotion-deactivate-modal>
