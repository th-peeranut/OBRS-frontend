@if (isRefreshing && !isLoading) {
  <section class="admin-page-intro">
    <div>
      <app-admin-refresh-hint
        [refreshing]="isRefreshing"
        [failed]="false"
        [loading]="isLoading"
      ></app-admin-refresh-hint>
    </div>
  </section>
}

<section class="admin-page-filters mt-3">
  <app-admin-date-range-picker
    [from]="fromDate"
    [to]="toDate"
    (rangeChange)="onRangeChange($event)"
  ></app-admin-date-range-picker>
</section>

<app-settlements-list
  [items]="items"
  [contentState]="contentState"
  [message]="stateMessage"
  (rowClick)="openDetail($event)"
></app-settlements-list>

<app-settlement-detail-modal
  [isOpen]="openScheduleId !== null"
  [summary]="modalSummary"
  [detail]="modalDetail"
  [isFetching]="isDetailFetching"
  [isConfirming]="isConfirming"
  [fetchError]="detailFetchError"
  [handoverCandidates]="handoverCandidates"
  (closed)="closeDetail()"
  (confirmRequested)="requestConfirm($event)"
  (retryFetch)="retryFetch()"
></app-settlement-detail-modal>

<!-- OBRS-960: second, independent stacked section — a driver-cash "day" is
not a settlement "round" (different semantics), so its own date-range
filter, own store, own list. Not a new tab/route — mirrors how
ReportsPageComponent/ExpensesPageComponent already stack independent
sections on one page. -->
<!-- OBRS-1753: the same one-control range picker the main filter above uses. After OBRS-1735
     swept the two-field pattern off every report page, this sub-filter was the last pair of
     From/To boxes left in the app — and it sat on the one page that ALSO showed the swept
     version, so the screen taught two patterns at once. The code was never confused
     (rangeError / driverCashRangeError have always been separate); the screen was. -->
<section class="admin-page-filters mt-4" data-testid="driver-cash-days-filter">
  <app-admin-date-range-picker
    [from]="driverCashFromDate"
    [to]="driverCashToDate"
    (rangeChange)="onDriverCashRangeChange($event)"
  ></app-admin-date-range-picker>
</section>

<app-driver-cash-days-list
  [items]="driverCashDays"
  [contentState]="driverCashContentState"
  [message]="driverCashStateMessage"
  (rowClick)="openDayDetail($event)"
></app-driver-cash-days-list>

<app-driver-cash-day-return-modal
  [isOpen]="openDayId !== null"
  [summary]="dayModalSummary"
  [detail]="dayModalDetail"
  [isFetching]="isDayDetailFetching"
  [isConfirming]="isDayConfirming"
  [fetchError]="dayDetailFetchError"
  [isReopening]="isDayReopening"
  (closed)="closeDayDetail()"
  (confirmRequested)="requestDayReturn($event)"
  (reopenRequested)="requestDayReopen($event)"
  (retryFetch)="retryDayFetch()"
></app-driver-cash-day-return-modal>
