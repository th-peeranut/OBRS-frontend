@if (showMap) {
  <google-map
    class="stop-map-picker-map"
    [options]="mapOptions"
    width="100%"
    height="280px"
    (mapClick)="onMapClick($event)"
  >
    <!-- OBRS-1030: classic marker (map-marker), NOT AdvancedMarkerElement
         (map-advanced-marker). An advanced marker refuses to draw without a Cloud Map ID,
         and this project's environment has none configured on this machine
         (environment.base.ts's mapsMapId default is '') -- measured on a real run against
         the origin-allowed key: 0 <gmp-advanced-marker> elements rendered, and the console
         logged Google's own "The map is initialized without a valid Map ID, which will
         prevent use of Advanced Markers" warning, so no pin ever appeared. A classic marker
         has no Map ID requirement. -->
    <map-marker
      [position]="markerPosition"
      [options]="markerOptions"
      (mapDragend)="onMarkerDragEnd($event)"
    ></map-marker>
  </google-map>
  <small class="admin-hint">{{ 'ADMIN.STOPS.MAP_HINT' | translate }}</small>
} @else if (apiKey && !mapsError) {
  <div class="stop-map-picker-placeholder d-flex align-items-center justify-content-center">
    <span class="admin-muted small">{{ 'ADMIN.COMMON.LOADING' | translate }}</span>
  </div>
} @else {
  <div class="stop-map-picker-placeholder d-flex align-items-center justify-content-center">
    <span class="admin-muted small">{{ 'ADMIN.STOPS.MAP_UNAVAILABLE' | translate }}</span>
  </div>
}
