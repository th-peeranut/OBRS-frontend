<ul class="nav nav-tabs" role="tablist" data-testid="system-settings-tabs">
  @for (tab of tabs; track tab) {
    <li class="nav-item">
      <a
        class="nav-link"
        role="tab"
        [routerLink]="tab.path"
        routerLinkActive="active"
        #tabLink="routerLinkActive"
        [attr.aria-selected]="tabLink.isActive"
        [attr.data-testid]="'system-settings-tab-' + tab.path"
        >
        {{ tab.labelKey | translate }}
      </a>
    </li>
  }
</ul>

<router-outlet></router-outlet>
