<section class="admin-page-intro">
  <div>
    @if (isLoading) {
      <p class="admin-muted">{{ 'ADMIN.COMMON.LOADING' | translate }}</p>
    }
    @if (errorMessage) {
      <p class="admin-muted">{{ errorMessage }}</p>
    }
    <app-admin-refresh-hint [refreshing]="isRefreshing" [failed]="refreshFailed" [loading]="isLoading"></app-admin-refresh-hint>
  </div>
  <button type="button" class="admin-btn admin-btn-primary" (click)="openCreateModal()">
    <span class="material-symbols-outlined" [attr.translate]="'no'">person_add</span>
    <span>{{ 'ADMIN.USERS.INVITE' | translate }}</span>
  </button>
</section>

<section class="admin-grid admin-grid--3 mt-3">
  <article class="admin-card">
    <p class="admin-muted">{{ 'ADMIN.USERS.ACTIVE_USERS' | translate }}</p>
    <p class="admin-big-number">{{ activeUsers }}</p>
  </article>
</section>

<section class="admin-page-filters mt-3">
  <label class="admin-input">
    <span class="material-symbols-outlined" [attr.translate]="'no'">search</span>
    <input
      type="text"
      [value]="searchKeyword"
      (input)="onSearchKeywordChange($any($event.target).value)"
      [placeholder]="'ADMIN.LAYOUT.SEARCH_PLACEHOLDER' | translate"
      />
    </label>

    <app-admin-dropdown
      [value]="selectedRoleFilter"
      [options]="roleFilterOptions"
      valueKey="slug"
      labelKey="label"
      [placeholder]="'ADMIN.USERS.FILTER_ROLE' | translate"
      (valueChange)="onRoleFilterChange($event)"
    ></app-admin-dropdown>

    <app-admin-dropdown
      [value]="selectedStatusFilter"
      [options]="statusOptions"
      valueKey="code"
      labelKey="label"
      [placeholder]="'ADMIN.USERS.FILTER_STATUS' | translate"
      (valueChange)="onStatusFilterChange($event)"
    ></app-admin-dropdown>
  </section>

  <app-user-list-table
    [rows]="filteredUsers"
    [isLoading]="isLoading"
    [skeletonRows]="skeletonRows"
    [hasError]="!!errorMessage"
    [canUnlock]="hasAdminRole()"
    [totalCount]="users.length"
    (edit)="openEditModal($event)"
    (delete)="openDeleteModal($event)"
    (unlock)="openUnlockModal($event)"
  ></app-user-list-table>

  <app-user-form-modal
    [isOpen]="isFormModalOpen"
    [mode]="mode"
    [selectedUser]="selectedUser"
    [roleOptions]="roleOptions"
    [statusOptions]="statusOptions"
    [reloadStructure]="reloadStructureBound"
    (closed)="onFormModalClosed()"
  ></app-user-form-modal>

  <app-user-delete-modal
    [isOpen]="isDeleteModalOpen"
    [user]="selectedUser"
    [isDeleting]="isDeleting"
    (confirm)="confirmDelete()"
    (cancel)="closeDeleteModal()"
  ></app-user-delete-modal>

  <app-user-unlock-modal
    [isOpen]="isUnlockModalOpen"
    [user]="selectedUser"
    [isUnlocking]="isUnlocking"
    (confirm)="confirmUnlock()"
    (cancel)="closeUnlockModal()"
  ></app-user-unlock-modal>
