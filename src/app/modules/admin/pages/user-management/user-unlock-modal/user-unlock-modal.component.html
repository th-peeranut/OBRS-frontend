@if (isOpen) {
  <div class="admin-modal-backdrop" adminModalBackdrop (dismiss)="cancel.emit()">
    <div class="admin-modal admin-modal-confirm">
      <h4 class="admin-modal-title">{{ 'ADMIN.USERS.UNLOCK_CONFIRM_TITLE' | translate }}</h4>
      <p class="admin-modal-subtitle">
        {{ 'ADMIN.USERS.UNLOCK_CONFIRM_MESSAGE' | translate }}
        @if (user) {
          <strong>{{ user.title | titleLabel: user.fullName }}</strong>
        }
      </p>
      <div class="admin-modal-actions">
        <button type="button" class="admin-btn" (click)="cancel.emit()">
          {{ 'ADMIN.COMMON.CANCEL' | translate }}
        </button>
        <button type="button" class="admin-btn admin-btn-primary" [disabled]="isUnlocking" (click)="confirm.emit()">
          {{ isUnlocking ? ('ADMIN.USERS.UNLOCKING' | translate) : ('ADMIN.USERS.UNLOCK_BTN' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
