<app-navbar></app-navbar>

<section class="policy-container">
  <div class="policy-card">
    <h1>{{ "POLICY.BUSINESS.TITLE" | translate }}</h1>
    @if (policyParams) {
      <p
      [innerHTML]="'POLICY.BUSINESS.SALES_CHANNELS' | translate: policyParams"></p>
    } @else {
      @if (!policyLoadFailed) {
        <div class="policy-skeleton-block" aria-hidden="true">
          <span class="policy-skeleton"></span>
          <span class="policy-skeleton policy-skeleton--sm"></span>
        </div>
      }
      @if (policyLoadFailed) {
        <div class="policy-inline-error" role="alert">
          <span class="material-symbols-outlined policy-inline-error-icon" [attr.translate]="'no'" aria-hidden="true">error</span>
          <span>{{ 'POLICY.BUSINESS.SALES_CHANNELS_ERROR' | translate }}</span>
          <button type="button" class="btn btn-link p-0 policy-inline-retry" (click)="retryPolicyParams()">
            {{ 'POLICY.BUSINESS.RETRY' | translate }}
          </button>
        </div>
      }
    }
    <p [innerHTML]="'POLICY.BUSINESS.CONTENT' | translate"></p>

    <!-- OBRS-627 AC-5: item 7 of CONTENT above used to repeat the refund terms
         verbatim from /refund-policy — one edit away from the two pages
         contradicting each other, which is how they reached the state that card
         reports. /refund-policy is now the single source and item 7 is a pointer;
         this is the clickable half of that pointer. -->
    <p class="policy-cross-link">
      <a routerLink="/refund-policy">{{ 'POLICY.BUSINESS.SEE_REFUND_POLICY' | translate }}</a>
    </p>
  </div>
</section>

<app-footer></app-footer>
