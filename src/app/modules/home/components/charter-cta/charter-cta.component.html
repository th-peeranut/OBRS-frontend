<section class="charter-section">
  <div class="charter-card">
    <div class="charter-text">
      <!-- TITLE -->
      <h2 class="charter-title">{{ "HOME.CHARTER.TITLE" | translate }}</h2>
      <!-- WHAT WE TAKE -->
      <p class="charter-desc">{{ "HOME.CHARTER.DESC" | translate }}</p>
      <!-- LEAD TIME: contract E-51-29 clause 8 needs written permission 3 days ahead -->
      <p class="charter-note">{{ "HOME.CHARTER.LEAD_TIME_NOTE" | translate }}</p>
    </div>
    <!-- CALL CTA -->
    <a class="charter-call-btn" href="tel:0814284492" (click)="onCallClick()">
      <span class="material-symbols-outlined charter-call-icon" [attr.translate]="'no'">call</span>
      {{ "HOME.CHARTER.CALL_CTA" | translate }}
    </a>
  </div>
</section>
