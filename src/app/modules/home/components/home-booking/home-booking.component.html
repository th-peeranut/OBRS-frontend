<div class="booking-container">
  <!-- MAIN BACKGROUND -->
  <img class="home-bg" src="images/home-bg.svg" />

  <div class="booking-section">
    @if (bookingForm) {
      <div class="booking-card" [formGroup]="bookingForm">
        <div class="d-flex gap-5">
          <!-- TRIP TYPE PILLS (OBRS-1025). Replaces app-dropdown-obrs: with
          round-trip now the default (OBRS-1185), the one-way route back must
          not be hidden behind a dropdown click — both options are visible and
          reachable in one tap from either state. -->
          <app-trip-type-toggle
            [options]="roundTripDropdowns"
            formControlName="roundTrip"
          ></app-trip-type-toggle>
          <!-- DROPDOWN PASSENGER COUNT -->
          <app-dropdown-obrs-passenger
            formControlName="passengerInfo"
          ></app-dropdown-obrs-passenger>
        </div>
        <!-- RECENT ROUTES QUICK PICK (OBRS-575) — renders nothing when empty (AC#5).
        OBRS-928 moved it here, directly above the origin/destination fields:
        the moment a user needs it is the moment they are looking at an empty
        ต้นทาง, not the moment the page loads. Sits BEFORE `.station-section`
        rather than inside it — that element is a flex ROW, so a child would
        land beside the fields instead of above them. -->
        <app-recent-routes-quick-pick
          [routes]="recentRouteCandidates"
          [activeOriginId]="getFormValue('startStationId')"
          [activeDestinationId]="getFormValue('stopStationId')"
          (routeSelected)="onRecentRouteSelected($event)"
        ></app-recent-routes-quick-pick>
        <!-- STATION LOAD FAILURE (OBRS-1222). Renders nothing at all unless the
        roster load failed AND the localStorage cache left the roster empty —
        the condition lives in the component, not here, because the identical
        block sits in schedule-booking-filter and the twin booking forms have
        already drifted on a duplicated line four times (OBRS-1021/1023/1028/1036).
        Sits OUTSIDE `.station-section` for the same reason the quick-pick strip
        does: that element is a flex ROW, so a child would land beside the
        dropdowns instead of above them. -->
        <app-station-load-error></app-station-load-error>
        <!-- `mt-4` moved into the scss (OBRS-928): the utility carries
        `!important`, which would out-rank the tighter `.has-routes +` spacing
        rule that pulls the fields up against the strip. -->
        <div class="station-section">
          @if (rawProvinceStationList | async) {
            <div class="station-group">
              <!-- DROPDOWN START STATION -->
              <app-dropdown-group-obrs
                [isBorder]="true"
                [isLabel]="true"
                [label]="'HOME.HOME_BOOKING.START_STATION'"
                [value]="getFormValue('startStationId')"
                [options]="startProvinceStationList"
                [searchable]="true"
                (currentValue)="onStartStationChange($event)"
              ></app-dropdown-group-obrs>
              <!-- SWAP ORIGIN/DESTINATION. OBRS-1035: this used to be a bare
              decorative <img> that every user read as a swap button — the one
              slot on the form where that icon can only mean one thing. It is a
              real button now, and OBRS-1038 moved it onto the seam of the merged
              bar. It carries NO positioning class: both axes are owned by
              `app-station-swap-button`'s own stylesheet, and the `station-icon`
              hook that used to be here existed only for the per-call-site
              nudges 1035 deleted. -->
              <app-station-swap-button
                [disabled]="!canSwapStations"
                (swap)="onSwapStations()"
              ></app-station-swap-button>
                <!-- DROPDOWN STOP STATION -->
                <app-dropdown-group-obrs
                  [isBorder]="true"
                  [isLabel]="true"
                  [label]="'HOME.HOME_BOOKING.END_STATION'"
                  [value]="getFormValue('stopStationId')"
                  [options]="endProvinceStationList"
                  [searchable]="true"
                  (currentValue)="onEndStationChange($event)"
                ></app-dropdown-group-obrs>
              </div>
            }
            <!-- DEPARTURE DATE -->
            <div class="form-group-obrs">
              <!-- LABEL. OBRS-1021: in round-trip mode this field stops being
              "the date" and becomes "the OUTBOUND date", so it switches to the
              ROUND_DEPARTURE/ROUND_RETURN pair the i18n files have carried
              (all three locales) since before this screen shipped — the two
              keys had zero call sites, which is why nothing was ever mistranslated
              and nothing was ever right either. One-way keeps DEPARTURE_DATE:
              with a single date field there is no "outbound" to contrast with.

              OBRS-1028: `for`/`inputId` name THIS field. Both calendars used to
              carry `inputId="templatedisplay"`, so round-trip mode put two
              elements with the same id in one document, and neither label was
              associated with anything — OBRS-1021 gave the two fields different
              words, but a screen reader still announced two unnamed text boxes.
              Pattern copied from reschedule-date-picker-step.component.html,
              which has paired them correctly since it shipped. -->
              <label for="home-departure-date">
                {{ (isRoundTripReturn ? "HOME.HOME_BOOKING.ROUND_DEPARTURE" : "HOME.HOME_BOOKING.DEPARTURE_DATE") | translate }} :
              </label>
              <!-- CALENDAR MAIN ELEMENT

              OBRS-1023: `dateFormat` is BOUND, not a literal. `dd/mm/yy` sat
              here, and PrimeNG resolves the format as `this.dateFormat ||
              getTranslation('dateFormat')` — so the literal did not duplicate
              the translated value, it SHADOWED it, and the CALENDAR.dateFormat
              we ship in three locales had never once reached a picker. An
              English visitor read Thai field order on the screen where they
              commit to a ticket, and `03/08/2026` is equally readable as
              8 March. The `D, ` prefix comes from the same signal (see
              LanguageService) and resolves through `dayNamesShort`: a bus
              timetable is not the same on a Saturday as on a Tuesday.

              OBRS-1036: `readonlyInput` is the price of that `D`, paid on
              purpose. `getDateFormat()` serves render AND parse, so the token
              that prints `Mon, ` is the one `parseDate` walks on the way back
              in — `case 'D'` calls `getName`, which throws on text with no day
              name, and `onUserInput` answers a throw by writing `null` into the
              model. A customer typing `03/08/2026` watched the box empty
              itself. `readonly`, never `disabled`: the input must still focus
              and still open the calendar it is now the only way into. -->
              <p-datePicker
                styleClass="app-date-field"
                panelStyleClass="app-date-field-panel"
                [dateFormat]="calendarDateFormat()"
                [readonlyInput]="true"
                [minDate]="minDate"
                [maxDate]="maxDate"
                [iconDisplay]="'input'"
                [showIcon]="true"
                inputId="home-departure-date"
                formControlName="departureDate"
                >
                <!-- CUSTOM CALENDAR ICON -->
                <ng-template pTemplate="inputicon">
                  <img
                    class="app-date-field-icon"
                    src="icons/calendar.svg"
                    [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
                    />
                  </ng-template>
                </p-datePicker>
              </div>
              <!-- ROUND TRIP RETURN -->
              @if (isRoundTripReturn) {
                <!-- RETURN DATE. The comment said DEPARTURE DATE because this
                whole block was copied from the one above, label included — the
                two fields rendered the same words and only their order told a
                customer which was which (OBRS-1021). -->
                <div class="form-group-obrs">
                  <!-- LABEL (OBRS-1028: its own id — this block only renders
                  alongside the departure one, so a shared id was always a
                  duplicate, never a merely-unhelpful name). -->
                  <label for="home-return-date">
                    {{ "HOME.HOME_BOOKING.ROUND_RETURN" | translate }} :
                  </label>
                  <!-- CALENDAR MAIN ELEMENT (OBRS-1023: same bound format as the
                  departure field above — a return date shown in a different
                  order from the outbound one would be worse than either.
                  OBRS-1036: and the same `readonlyInput`, for the same reason —
                  two date fields side by side where only one refuses typing
                  would read as a broken one, not as a rule.

                  OBRS-1185: `[minDate]` is the CURRENT departureDate, not the
                  shared `minDate` (today) — a return date before the chosen
                  outbound date must be unpickable in the calendar itself,
                  rather than a 400 the server rejects it with later. Reads
                  straight off the form control (already the pattern this
                  template uses for the station pickers' `[value]`) so it
                  tracks every departureDate change with no extra field to
                  keep in sync.) -->
                  <p-datePicker
                    styleClass="app-date-field"
                    panelStyleClass="app-date-field-panel"
                    [dateFormat]="calendarDateFormat()"
                    [readonlyInput]="true"
                    [minDate]="getFormValue('departureDate')"
                    [maxDate]="maxDate"
                    [iconDisplay]="'input'"
                    [showIcon]="true"
                    inputId="home-return-date"
                    formControlName="returnDate"
                    >
                    <!-- CUSTOM CALENDAR ICON -->
                    <ng-template pTemplate="inputicon">
                      <img
                        class="app-date-field-icon"
                        src="icons/calendar.svg"
                        [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
                        />
                      </ng-template>
                    </p-datePicker>
                  </div>
                }
              </div>
              <!-- FORM ACTIONS — map hint on the left, search on the right (OBRS-1562).
              The hint used to carry `w-100` inside `.station-section`, and that one
              class was what split the fields across two rows: a 100%-wide flex item
              takes a line of its own, so the two date pickers wrapped underneath the
              origin/destination bar. Measured on prod 2026-08-23 they fit beside it
              with room to spare (506 + 20 + 281 + 20 + 281 = 1108 of 1136), which left
              the right half of a 1200px card carrying nothing. Moved here it fills
              the one row that was already half empty — the search button's — instead
              of buying a third row of its own.

              The `@if` is the same store selector that guards the station block above,
              repeated rather than hoisted: this element no longer shares a parent with
              that block, and the guard is the reason the hint does not appear before
              the fields it refers to (OBRS-1211). `selectProvinceWithStation` is an
              NgRx selector, so the second `| async` costs one more subscription to an
              already-multicast source, not a second load. -->
              <div class="form-actions">
                @if (rawProvinceStationList | async) {
                  <button type="button" class="btn btn-link p-0 map-hint-btn"
                          data-testid="show-route-map" (click)="onMapHintClick()">
                    <i class="bi bi-map me-1" aria-hidden="true"></i>
                    {{ 'HOME.ROUTE_MAP.MAP_HINT_CTA' | translate }}
                  </button>
                }
                <button class="btn btn-search" type="button" (click)="onSearch()">
                  <img src="icons/search.svg" alt="Search Icon" />
                  {{ "HOME.HOME_BOOKING.SEARCH" | translate }}
                </button>
              </div>
            </div>
          }
        </div>
      </div>
