<div class="ticket-modal-backdrop" (click)="onBackdropClick($event)">
  <div class="ticket-modal" role="dialog" aria-modal="true">
    <button
      type="button"
      class="ticket-modal__close"
      (click)="close()"
      [attr.aria-label]="'MY_BOOKINGS.TICKET_MODAL.CLOSE' | translate"
    >
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="ticket-modal__body">
      <div class="ticket-modal__state" *ngIf="loading">
        <span class="ticket-modal__spinner" aria-hidden="true"></span>
        <p>{{ "MY_BOOKINGS.TICKET_MODAL.LOADING" | translate }}</p>
      </div>

      <div class="ticket-modal__state" *ngIf="!loading && error">
        <i class="bi bi-exclamation-triangle"></i>
        <p>{{ error }}</p>
        <button type="button" class="ticket-modal__retry" (click)="retry()">
          {{ "MY_BOOKINGS.RETRY" | translate }}
        </button>
      </div>

      <ng-container *ngIf="!loading && !error && card">
        <app-e-ticket-card
          [bookingNumber]="card.bookingNumber"
          [ticketNumber]="card.ticketNumber"
          [legs]="card.legs"
          [paymentDate]="card.paymentDate"
          [totalAmount]="card.totalAmount"
          [passengers]="card.passengers"
          [booker]="card.booker"
        ></app-e-ticket-card>

        <!-- SPEC-OBRS-426 BR-2: sibling of app-e-ticket-card, below it, never
             inside it (the paper surface is dark-mode-exempt). One tracker
             per leg with an eligible ticket (BR-4/BR-4a) — index-aligned with
             card.legs, skip a null hole. -->
        <ng-container *ngFor="let leg of card.legs; let i = index">
          <app-trip-track-panel
            *ngIf="trackTargets[i] as target"
            [ticketId]="target.ticketId"
            [boardingStopLabel]="target.boardingStopLabel"
            [boardingStopLat]="target.boardingStopLat"
            [boardingStopLon]="target.boardingStopLon"
          ></app-trip-track-panel>
        </ng-container>
      </ng-container>
    </div>
  </div>
</div>
