<form class="parcel-trip-form" [formGroup]="form">
  <div class="parcel-trip-form__stations">
    <app-dropdown-group-obrs
      [isBorder]="true"
      [isLabel]="true"
      [label]="'PARCEL_BOOKING.TRIP.FROM_STATION'"
      [value]="form.get('fromStationId')?.value"
      [options]="fromStationOptions"
      [searchable]="true"
      (currentValue)="onFromStationSelect($event)"
    ></app-dropdown-group-obrs>

    <!-- SWAP ORIGIN/DESTINATION. OBRS-1035 — the third copy of the dead icon.
    A parcel sender swaps as often as a passenger does (the same shop sends to
    Bangkok on Monday and receives from it on Friday), so this one is wired
    exactly like the two booking forms.

    OBRS-1038: no positioning class — its size comes from the bar's own
    `--station-swap-icon-size`, and both its axes come from its own stylesheet. -->
    <app-station-swap-button
      [disabled]="!canSwapStations"
      (swap)="onSwapStations()"
    ></app-station-swap-button>

      <app-dropdown-group-obrs
        [isBorder]="true"
        [isLabel]="true"
        [label]="'PARCEL_BOOKING.TRIP.TO_STATION'"
        [value]="form.get('toStationId')?.value"
        [options]="toStationOptions"
        [searchable]="true"
        (currentValue)="onToStationSelect($event)"
      ></app-dropdown-group-obrs>
    </div>

    @if (stationsSame) {
      <div class="parcel-trip-form__error">
        {{ "PARCEL_BOOKING.VALIDATION.FROM_TO_SAME" | translate }}
      </div>
    }

    <div class="form-group-obrs">
      <label>{{ "PARCEL_BOOKING.TRIP.DATE" | translate }}</label>
      <p-datePicker
        styleClass="app-date-field"
        panelStyleClass="app-date-field-panel"
        dateFormat="dd/mm/yy"
        [minDate]="minDate"
        [iconDisplay]="'input'"
        [showIcon]="true"
        inputId="parcelTripDate"
        formControlName="date"
        >
        <ng-template pTemplate="inputicon">
          <img
            class="app-date-field-icon"
            src="icons/calendar.svg"
            [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
            />
          </ng-template>
        </p-datePicker>
      </div>

      <div class="form-group-obrs">
        <label>{{ "PARCEL_BOOKING.TRIP.SCHEDULE" | translate }}</label>

        @if (isLoadingSchedules) {
          <div class="text-center py-3">
            <span class="material-symbols-outlined" [attr.translate]="'no'">hourglass_empty</span>
          </div>
        }

        @if (!isLoadingSchedules && noSchedulesFound) {
          <div class="parcel-trip-form__empty">
            {{ "PARCEL_BOOKING.TRIP.NO_SCHEDULES" | translate }}
          </div>
        }

        @if (!isLoadingSchedules && !noSchedulesFound) {
          <app-dropdown-group-obrs
            [isBorder]="true"
            [value]="form.get('scheduleId')?.value"
            [options]="scheduleOptions"
            (currentValue)="onScheduleSelect($event)"
          ></app-dropdown-group-obrs>
        }
      </div>

      <div class="parcel-trip-form__actions">
        <button type="button" class="parcel-btn-primary" [disabled]="!canGoNext" (click)="onNext()">
          {{ "PARCEL_BOOKING.TRIP.NEXT" | translate }}
        </button>
      </div>
    </form>
