<!-- SEAT -->
<div
  class="seat-box"
  [class.disabled]="isDisabled"
  (click)="setPassengerSeatOuput(label)"
>
  {{ label }}

  <!-- Male -->
  <img
    *ngIf="!isDisabled && gender == 'MALE'"
    class="passenger-male-icon"
    src="icons/passenger-male.svg"
    alt="Passenger Male Icon"
  />

  <!-- Female -->
  <img
    *ngIf="!isDisabled && gender == 'FEMALE'"
    class="passenger-female-icon"
    src="icons/passenger-female.svg"
    alt="Passenger Female Icon"
  />

  <!-- Monk -->
  <img
    *ngIf="!isDisabled && gender == 'MONK'"
    class="passenger-monk-icon"
    src="icons/passenger-monk.svg"
    alt="Passenger Monk Icon"
  />

  <!-- Selected (neutral marker — no gender, e.g. the change-seat dialog) -->
  <span
    *ngIf="!isDisabled && gender == 'SELECTED'"
    class="material-symbols-outlined passenger-selected-icon"
    aria-hidden="true"
  >check_circle</span>
</div>
