<!-- OBRS-384: rendered from `rows` (the caller's seatLayout, or the built-in
13-seat van default) instead of hardcoding A1–A13, so any vehicle size —
e.g. a 21-seat minibus — can be rendered. The default layout produces the
exact same DOM the previous hardcoded template did. -->
<div class="card-container">
  <!-- OBRS-967: tracked by $index, NOT by the row/cell object. A SeatLayout is built
  from SHARED cell constants (`EMPTY`/`DRIVER` in shared/lib/seat-layout.ts), so the
  default van's first row holds the very same EMPTY reference at index 1 and index 2 —
  identity tracking handed @for two equal keys and Angular logged NG0955 on every
  render. A layout is positional and never reorders in place, so $index IS the
  identity here. -->
  @for (row of rows; track $index) {
    <div class="seat-row">
      @for (cell of row; track $index) {
        @switch (cell.kind) {
          <!-- SEAT -->
          @case ('seat') {
            <app-passenger-seat-box
              [label]="cell.label"
              [gender]="seatGenderFor(cell.label)"
              [isDisabled]="isSeatDisabled(cell.label) && !isSeatActive(cell.label)"
              [ownerLabel]="ownerLabelFor(cell.label)"
              [isActiveOwner]="isActiveOwnerFor(cell.label)"
              [isBlocked]="isSeatBlocked(cell.label)"
              [blockedSeatAriaLabel]="blockedSeatAriaLabel"
              [hasWheelchairBadge]="hasWheelchairBadge(cell.label)"
              [hasExtraLegroomBadge]="hasExtraLegroomBadge(cell.label)"
              [wheelchairBadgeAriaLabel]="wheelchairBadgeAriaLabel"
              [extraLegroomBadgeAriaLabel]="extraLegroomBadgeAriaLabel"
              (passengerSeatOutput)="setPassengerSeatPosition($event)"
              >
            </app-passenger-seat-box>
          }
          <!-- DRIVER -->
          @case ('driver') {
            <div class="driver-box">
              <img src="images/passenger-driver.png" alt="Passenger Driver Image" />
            </div>
          }
          <!-- EMPTY -->
          @default {
            <div class="empty-box"></div>
          }
        }
      }
    </div>
  }
</div>
