<app-navbar></app-navbar>

<app-stepper></app-stepper>

<!-- OBRS-1246 - decision for THIS page: (a) show the surface.
  Option (b), "prove the page is unreachable while the roster is empty", was
  tested and FAILS here: app-routing.module.ts:101-109 gives /passenger-info the
  identical route entry to /e-ticket - `canActivate: [AuthGuard]` +
  `data: { customerArea: true }`, no `requireAuth`, no resolver - and
  passenger-info.module.ts declares `{ path: '', component: ... }` with no child
  guard of its own. A direct link therefore lands here without ever passing
  through /home, the only place a successful roster load would have happened
  first. "You must have come through the booking form" is an assumption the
  router does not enforce.
  Unlike /e-ticket there is no second source for the names here - the summary
  resolves them from the roster alone (passenger-info-summary.component.ts) - so
  the component's own condition (load failed AND roster empty) is already
  exactly right and needs no extra gate.
  Placed OUTSIDE `.content-container` because that element is a flex ROW: a
  child would sit BESIDE the form instead of above it, the same trap
  home-booking.component.html records. -->
<div class="station-load-error-slot">
  <app-station-load-error></app-station-load-error>
</div>

<div class="content-container">
  <div class="form-container">
    <h3 class="title">
      {{ "PASSENGER_INFO.PAGE.FORM_TITLE" | translate }}
    </h3>

    <app-booker-info-form
      (validityChange)="onBookerFormValidityChange($event)"
    ></app-booker-info-form>

    <app-passenger-info-form
      (validityChange)="onPassengerFormValidityChange($event)"
      (useBookerAsPassenger)="onUseBookerAsPassenger($event)"
    ></app-passenger-info-form>
  </div>

  <div class="summary-container">
    <h3 class="title">
      {{ "PASSENGER_INFO.PAGE.SUMMARY_TITLE" | translate }}
    </h3>

    <app-passenger-info-summary
      [isNextDisabled]="!isPassengerFormValid || !isBookerFormValid"
      (next)="onSubmitPassengerInfo()"
      (back)="onBack()"
      (promoApplied)="onPromoApplied($event)"
      (promoRemoved)="onPromoRemoved()"
    ></app-passenger-info-summary>
  </div>
</div>

<app-footer></app-footer>
