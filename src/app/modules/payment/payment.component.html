<app-navbar></app-navbar>

<app-stepper></app-stepper>

<div class="content-container">
  <div class="summary-container">
    <app-payment-info></app-payment-info>
  </div>

  <div class="total-container">
    @if (activePaymentTab === 'creditcard') {
      <app-payment-creditcard
        [activeTab]="activePaymentTab"
        (tabChange)="onPaymentTabChange($event)"
        (back)="onBack()"
        (paymentCompleted)="onPaymentCompleted()"
      ></app-payment-creditcard>
    }
    @if (activePaymentTab === 'qrcode') {
      <app-payment-qrcode
        [activeTab]="activePaymentTab"
        (tabChange)="onPaymentTabChange($event)"
        (back)="onBack()"
        (paymentCompleted)="onPaymentCompleted()"
      ></app-payment-qrcode>
    }
  </div>
</div>

<app-footer></app-footer>
