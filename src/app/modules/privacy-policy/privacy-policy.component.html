<app-navbar></app-navbar>

<section class="policy-container">
  <div class="policy-card">
    <h1>{{ "POLICY.PRIVACY.TITLE" | translate }}</h1>
    <!-- OBRS-628 AC-3: version + date, so consent can be tied to a specific text.
         Both values come from privacy-policy.version.ts; the i18n key holds only
         the sentence around them. Never type the date into a translation file. -->
    <p class="policy-version" data-testid="privacy-policy-version">
      {{
        "POLICY.PRIVACY.VERSION_LINE"
          | translate: { version: version, effectiveDate: effectiveDate }
      }}
    </p>
    <p [innerHTML]="'POLICY.PRIVACY.CONTENT_1' | translate"></p>
    <p [innerHTML]="'POLICY.PRIVACY.CONTENT_2' | translate"></p>

    <!-- OBRS-874 AC-1: the withdrawal surface PDPA ม.19 วรรคห้า requires, on the
         page the consent bar already links to. Its keys live under
         ANALYTICS_CONSENT.*, NOT POLICY.PRIVACY.* — the latter is fingerprinted
         by the i18n ledger (gate 4), and this card must not move that hash. -->
    <app-analytics-consent-control></app-analytics-consent-control>
  </div>
</section>

<app-footer></app-footer>
