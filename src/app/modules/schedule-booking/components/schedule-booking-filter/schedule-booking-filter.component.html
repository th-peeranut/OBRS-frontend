<div class="booking-container">
  <div class="booking-section">
    @if (bookingForm) {
      <div class="booking-card" [formGroup]="bookingForm">
        <div class="d-flex gap-5">
          <!-- TRIP TYPE PILLS (OBRS-1025) — see the identical block in
          home-booking.component.html. This filter bar is a copy of that form;
          fixing only Home would have left the dropdown live on the results
          page, where a customer switching back to one-way is just as likely
          to hit it. -->
          <app-trip-type-toggle
            [options]="roundTripDropdowns"
            formControlName="roundTrip"
          ></app-trip-type-toggle>
          <!-- DROPDOWN PASSENGER COUNT -->
          <app-dropdown-obrs-passenger
            formControlName="passengerInfo"
          ></app-dropdown-obrs-passenger>
        </div>
        <!-- STATION LOAD FAILURE (OBRS-1222). The twin of the block in
        home-booking.component.html, and here for a reason the card's ACs do not
        name but OBRS-642's measurement does: `/` and `/schedule-booking` were
        BOTH blocked by this one call, and `ProvinceEffect` is the same effect on
        both. Since that effect now opts out of the global error modal, dropping
        this element would leave this page failing with no signal whatsoever. -->
        <app-station-load-error></app-station-load-error>
        <div class="station-section mt-4">
          @if (rawProvinceStationList | async) {
            <div class="station-group">
              <!-- DROPDOWN START STATION -->
              <app-dropdown-group-obrs
                [isBorder]="true"
                [isLabel]="true"
                [label]="'HOME.HOME_BOOKING.START_STATION'"
                [value]="getFormValue('startStationId')"
                [options]="startProvinceStationList"
                [searchable]="true"
                (currentValue)="onStartStationChange($event)"
              ></app-dropdown-group-obrs>
              <!-- SWAP ORIGIN/DESTINATION. OBRS-1035 — see the identical block
              in home-booking.component.html. This filter bar is a copy of that
              form and carried the same dead icon; fixing only Home would have
              left it live on the results page, where a customer checking the
              return leg is the likeliest person in the app to want a swap.
              AC#6: swapping does NOT re-run the search — the results the user
              is reading stay on screen until they press Search themselves. -->
              <app-station-swap-button
                [disabled]="!canSwapStations"
                (swap)="onSwapStations()"
              ></app-station-swap-button>
                <!-- DROPDOWN STOP STATION -->
                <app-dropdown-group-obrs
                  [isBorder]="true"
                  [isLabel]="true"
                  [label]="'HOME.HOME_BOOKING.END_STATION'"
                  [value]="getFormValue('stopStationId')"
                  [options]="endProvinceStationList"
                  [searchable]="true"
                  (currentValue)="onEndStationChange($event)"
                ></app-dropdown-group-obrs>
              </div>
            }
            <!-- DEPARTURE DATE. OBRS-1189 — see the identical block in
            home-booking.component.html: this filter bar is a copy of that form,
            and a segment that is a segment on only one of the two screens is the
            OBRS-1021/1023/1028/1036 drift all over again. -->
            <div class="form-group-obrs has-inline-label">
              <!-- LABEL. OBRS-1021 — see the identical block in
              home-booking.component.html. This filter bar is a copy of that
              form and carried the same two-identical-labels bug; fixing only
              the Home screen would have left it live on the results page,
              where a customer refining a round trip is even more likely to be
              changing exactly one of the two dates.

              OBRS-1028 — same story one layer down: the copy also brought
              `inputId="templatedisplay"` and a label bound to nothing. The ids
              are prefixed `filter-` rather than reusing the Home ones so that
              the pair stays unique even if the two forms ever share a page. -->
              <label class="field-inline-label" for="filter-departure-date">
                {{ (isRoundTripReturn ? "HOME.HOME_BOOKING.ROUND_DEPARTURE" : "HOME.HOME_BOOKING.DEPARTURE_DATE") | translate }}
              </label>
              <!-- CALENDAR MAIN ELEMENT

              OBRS-1023 — third defect on these same lines, same cause: the copy
              also brought `dateFormat="dd/mm/yy"`, which SHADOWS the
              `CALENDAR.dateFormat` we translate three ways (PrimeNG resolves it
              as `this.dateFormat || getTranslation('dateFormat')`). See the twin
              block in home-booking.component.html for the full note.

              OBRS-1036 — fourth defect on these same lines, and the cost of the
              third: the `D` that OBRS-1023 put in the format is also what
              `parseDate` walks on the way back in, where it throws and
              `onUserInput` clears the field. `readonlyInput` makes the calendar
              the only way in. Applied here as well as on the Home form because
              markup is exactly what does NOT propagate between two copies —
              the whole lesson of OBRS-1021/1028/1023 on these four lines. -->
              <p-datePicker
                styleClass="app-date-field app-date-field--segment"
                panelStyleClass="app-date-field-panel"
                [dateFormat]="calendarDateFormat()"
                [readonlyInput]="true"
                [minDate]="minDate"
                [maxDate]="maxDate"
                [iconDisplay]="'input'"
                [showIcon]="true"
                inputId="filter-departure-date"
                formControlName="departureDate"
                >
                <!-- CUSTOM CALENDAR ICON -->
                <ng-template pTemplate="inputicon">
                  <img
                    class="app-date-field-icon"
                    src="icons/calendar.svg"
                    [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
                    />
                  </ng-template>
                </p-datePicker>
              </div>
              <!-- ROUND TRIP RETURN -->
              @if (isRoundTripReturn) {
                <!-- RETURN DATE (OBRS-1021 — was labelled DEPARTURE DATE, in
                the comment and on screen, because the block is a copy). -->
                <div class="form-group-obrs has-inline-label">
                  <!-- LABEL (OBRS-1028) -->
                  <label class="field-inline-label" for="filter-return-date">
                    {{ "HOME.HOME_BOOKING.ROUND_RETURN" | translate }}
                  </label>
                  <!-- CALENDAR MAIN ELEMENT (OBRS-1023, OBRS-1036 — see the
                  twin block in home-booking.component.html.

                  OBRS-1185: `[minDate]` is the CURRENT departureDate, same
                  reasoning as the Home twin — a return date before the chosen
                  outbound date must be unpickable here too, not just on Home,
                  or a customer refining a round trip on this results page
                  hits the exact server 400 OBRS-1185 exists to prevent.) -->
                  <p-datePicker
                    styleClass="app-date-field app-date-field--segment"
                    panelStyleClass="app-date-field-panel"
                    [dateFormat]="calendarDateFormat()"
                    [readonlyInput]="true"
                    [minDate]="getFormValue('departureDate')"
                    [maxDate]="maxDate"
                    [iconDisplay]="'input'"
                    [showIcon]="true"
                    inputId="filter-return-date"
                    formControlName="returnDate"
                    >
                    <!-- CUSTOM CALENDAR ICON -->
                    <ng-template pTemplate="inputicon">
                      <img
                        class="app-date-field-icon"
                        src="icons/calendar.svg"
                        [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
                        />
                      </ng-template>
                    </p-datePicker>
                  </div>
                }
                <!-- SEARCH — the last SEGMENT of the bar (OBRS-1189 AC#3), the
                twin of the block in home-booking.component.html. The
                `d-flex justify-content-end w-100` wrapper that used to hold it
                is gone: a 100%-wide row is exactly what put the button on a line
                of its own, which is the thing this card removes. -->
                <button class="btn btn-search" type="button" (click)="onSearch()"
                        [attr.aria-label]="'HOME.HOME_BOOKING.SEARCH' | translate">
                  <img src="icons/search.svg" alt="Search Icon" />
                  <!-- Hidden between 993 and 1199 -- see the twin block in
                  home-booking.component.html for why, and why the aria-label
                  above is unconditional. -->
                  <span class="btn-search__label">{{ "HOME.HOME_BOOKING.SEARCH" | translate }}</span>
                </button>
              </div>
            </div>
          }
        </div>
      </div>
