<div class="booking-container">
  <div class="booking-section">
    @if (bookingForm) {
      <div class="booking-card" [formGroup]="bookingForm">
        <div class="d-flex gap-5">
          <!-- DROPDOWN ROUNDTRIP TYPE -->
          <app-dropdown-obrs
            [isBorder]="false"
            [isLabel]="false"
            [label]="'roundTrip'"
            [options]="roundTripDropdowns"
            formControlName="roundTrip"
          ></app-dropdown-obrs>
          <!-- DROPDOWN PASSENGER COUNT -->
          <app-dropdown-obrs-passenger
            formControlName="passengerInfo"
          ></app-dropdown-obrs-passenger>
        </div>
        <div class="station-section mt-4">
          @if (rawProvinceStationList | async) {
            <div class="station-group">
              <!-- DROPDOWN START STATION -->
              <app-dropdown-group-obrs
                [isBorder]="true"
                [isLabel]="true"
                [label]="'HOME.HOME_BOOKING.START_STATION'"
                [value]="getFormValue('startStationId')"
                [options]="startProvinceStationList"
                [searchable]="true"
                (currentValue)="onStartStationChange($event)"
              ></app-dropdown-group-obrs>
              <!-- STATION ICON -->
              <img
                class="station-icon"
                src="icons/passenger-station-gap.svg"
                alt="Passenger Station Gap Icon"
                />
                <!-- DROPDOWN STOP STATION -->
                <app-dropdown-group-obrs
                  [isBorder]="true"
                  [isLabel]="true"
                  [label]="'HOME.HOME_BOOKING.END_STATION'"
                  [value]="getFormValue('stopStationId')"
                  [options]="endProvinceStationList"
                  [searchable]="true"
                  (currentValue)="onEndStationChange($event)"
                ></app-dropdown-group-obrs>
              </div>
            }
            <!-- DEPARTURE DATE -->
            <div class="form-group-obrs">
              <!-- LABEL. OBRS-1021 — see the identical block in
              home-booking.component.html. This filter bar is a copy of that
              form and carried the same two-identical-labels bug; fixing only
              the Home screen would have left it live on the results page,
              where a customer refining a round trip is even more likely to be
              changing exactly one of the two dates.

              OBRS-1028 — same story one layer down: the copy also brought
              `inputId="templatedisplay"` and a label bound to nothing. The ids
              are prefixed `filter-` rather than reusing the Home ones so that
              the pair stays unique even if the two forms ever share a page. -->
              <label for="filter-departure-date">
                {{ (isRoundTripReturn ? "HOME.HOME_BOOKING.ROUND_DEPARTURE" : "HOME.HOME_BOOKING.DEPARTURE_DATE") | translate }} :
              </label>
              <!-- CALENDAR MAIN ELEMENT

              OBRS-1023 — third defect on these same lines, same cause: the copy
              also brought `dateFormat="dd/mm/yy"`, which SHADOWS the
              `CALENDAR.dateFormat` we translate three ways (PrimeNG resolves it
              as `this.dateFormat || getTranslation('dateFormat')`). See the twin
              block in home-booking.component.html for the full note. -->
              <p-datePicker
                styleClass="app-date-field"
                panelStyleClass="app-date-field-panel"
                [dateFormat]="calendarDateFormat()"
                [minDate]="minDate"
                [maxDate]="maxDate"
                [iconDisplay]="'input'"
                [showIcon]="true"
                inputId="filter-departure-date"
                formControlName="departureDate"
                >
                <!-- CUSTOM CALENDAR ICON -->
                <ng-template pTemplate="inputicon">
                  <img
                    class="app-date-field-icon"
                    src="icons/calendar.svg"
                    [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
                    />
                  </ng-template>
                </p-datePicker>
              </div>
              <!-- ROUND TRIP RETURN -->
              @if (isRoundTripReturn) {
                <!-- RETURN DATE (OBRS-1021 — was labelled DEPARTURE DATE, in
                the comment and on screen, because the block is a copy). -->
                <div class="form-group-obrs">
                  <!-- LABEL (OBRS-1028) -->
                  <label for="filter-return-date">
                    {{ "HOME.HOME_BOOKING.ROUND_RETURN" | translate }} :
                  </label>
                  <!-- CALENDAR MAIN ELEMENT (OBRS-1023) -->
                  <p-datePicker
                    styleClass="app-date-field"
                    panelStyleClass="app-date-field-panel"
                    [dateFormat]="calendarDateFormat()"
                    [minDate]="minDate"
                    [maxDate]="maxDate"
                    [iconDisplay]="'input'"
                    [showIcon]="true"
                    inputId="filter-return-date"
                    formControlName="returnDate"
                    >
                    <!-- CUSTOM CALENDAR ICON -->
                    <ng-template pTemplate="inputicon">
                      <img
                        class="app-date-field-icon"
                        src="icons/calendar.svg"
                        [attr.alt]="'COMMON.CALENDAR_ICON_ALT' | translate"
                        />
                      </ng-template>
                    </p-datePicker>
                  </div>
                }
              </div>
              <!-- SEARCH BUTTON -->
              <div class="d-flex justify-content-end w-100">
                <button class="btn btn-search" type="button" (click)="onSearch()">
                  <img src="icons/search.svg" alt="Search Icon" />
                  {{ "HOME.HOME_BOOKING.SEARCH" | translate }}
                </button>
              </div>
            </div>
          }
        </div>
      </div>
