<!-- No in-body title (design-system §7): the shell topbar already renders
the route's titleKey/subtitleKey (STAFF.PAGES.CANCEL_BOOKING /
STAFF.CANCEL_BOOKING.SUBTITLE) as the single title surface. -->
<section class="admin-card">
  <app-counter-cancel-search-form
    [submitting]="isSearching"
    (search)="onSearch($event)"
  ></app-counter-cancel-search-form>

  @if (searchErrorMessage) {
    <p class="admin-error ccp-search-error" role="alert">
      {{ searchErrorMessage }}
    </p>
  }
</section>

@if (hasSearched) {
  <section class="admin-card mt-3">
    <app-counter-cancel-result-list
      [results]="results"
      [loading]="isSearching"
      [hasSearched]="hasSearched"
      [page]="currentPage"
      [totalPages]="totalPages"
      (selectBooking)="onSelectBooking($event)"
      (pageChange)="onPageChange($event)"
    ></app-counter-cancel-result-list>
  </section>
}

<app-counter-cancel-modal
  [isOpen]="isModalOpen"
  [booking]="selectedBooking"
  (cancelled)="onModalCancelled()"
  (closed)="onModalClosed()"
></app-counter-cancel-modal>
