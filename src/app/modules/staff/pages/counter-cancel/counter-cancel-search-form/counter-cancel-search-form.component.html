<form [formGroup]="form" class="ccsf-form" (ngSubmit)="submit()">
  <div class="ccsf-fields">
    <div
      class="ccsf-mode-toggle"
      role="group"
      [attr.aria-label]="'STAFF.CANCEL_BOOKING.SEARCH.BUTTON' | translate"
      >
      <button
        type="button"
        class="admin-btn ccsf-mode-btn"
        [class.is-selected]="mode === 'phone'"
        [attr.aria-pressed]="mode === 'phone'"
        [disabled]="submitting"
        (click)="selectMode('phone')"
        >
        {{ 'STAFF.CANCEL_BOOKING.SEARCH.MODE_PHONE' | translate }}
      </button>
      <button
        type="button"
        class="admin-btn ccsf-mode-btn"
        [class.is-selected]="mode === 'bookingNumber'"
        [attr.aria-pressed]="mode === 'bookingNumber'"
        [disabled]="submitting"
        (click)="selectMode('bookingNumber')"
        >
        {{ 'STAFF.CANCEL_BOOKING.SEARCH.MODE_BOOKING_NUMBER' | translate }}
      </button>
    </div>

    @if (mode === 'phone') {
      <div class="ccsf-field">
        <input
          type="tel"
          inputmode="numeric"
          maxlength="10"
          class="admin-field"
          formControlName="phone"
          [placeholder]="'STAFF.CANCEL_BOOKING.SEARCH.MODE_PHONE' | translate"
          />
          @if (activeFieldInvalid) {
            <small class="admin-error">
              {{ phoneErrorKey | translate }}
            </small>
          }
        </div>
      }

      @if (mode === 'bookingNumber') {
        <div class="ccsf-field">
          <input
            type="text"
            class="admin-field"
            formControlName="bookingNumber"
            [placeholder]="'STAFF.CANCEL_BOOKING.SEARCH.MODE_BOOKING_NUMBER' | translate"
            (input)="onBookingNumberInput($event)"
            />
            @if (activeFieldInvalid) {
              <small class="admin-error">
                {{ 'STAFF.VALIDATION.REQUIRED' | translate }}
              </small>
            }
          </div>
        }

        <button type="submit" class="admin-btn admin-btn-primary" [disabled]="submitting" [appPending]="submitting">
          {{ 'STAFF.CANCEL_BOOKING.SEARCH.BUTTON' | translate }}
        </button>
      </div>
    </form>
