<div class="form-group-obrs">
  @if (isLabel) {
    <label> {{ label | translate }} : </label>
  }

  <div class="dropdown">
    <button
      #dropdownButton
      class="btn dropdown-btn dropdown-toggle p-0"
      type="button"
      [id]="'dropdownObrs' + label"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      [class.active]="isDropdownOpen"
      [class.dropdown-toggle-border]="isBorder"
      (click)="toggleDropdown()"
      >
      <!-- CURRENT VALUE -->
      <!-- OBRS-1231: an unselected dropdown used to render an empty button. That was
      invisible while every such dropdown auto-selected a default; now that title can
      legitimately hold nothing, the empty state needs to say so. -->
      <div class="value-text" [class.is-placeholder]="!selectedValue && placeholder">
        {{ selectedValue ? getValue(selectedValue) : (placeholder ? (placeholder | translate) : '') }}
      </div>

      <!-- ARROW ICON -->
      <img
        class="arrow-icon"
        [src]="isDropdownOpen ? 'arrow-up.svg' : 'arrow-down.svg'"
        alt="Arrow Icon"
        />
      </button>
      <!-- DROPDOWN LIST -->
      <ul
        class="dropdown-menu"
        [class.dropdown-menu-border]="isBorder"
        aria-labelledby="dropdownObrs"
        >
        <!-- DROPDOWN OPTION -->
        @for (option of optionList; track option; let optionIndex = $index) {
          <li>
            <a
              class="dropdown-item dropdown-option"
              (click)="setCurrentValue(option)"
              >
              {{ getValue(option) }}
            </a>
          </li>
        }

        @if (optionList.length === 0) {
          <li class="px-3">
            {{ "SHARED.NO_CONTENT" | translate }}
          </li>
        }
      </ul>
    </div>
  </div>
