<div class="notification-bell">
  <button
    type="button"
    class="admin-icon-btn notification-bell-trigger"
    (click)="togglePanel($event)"
    aria-haspopup="true"
    [attr.aria-expanded]="overlayPanel?.overlayVisible ?? false"
    [attr.aria-label]="'NOTIFICATIONS.BELL_ARIA' | translate: { count: (unreadCount$ | async) ?? 0 }"
    >
    <span class="material-symbols-outlined" [attr.translate]="'no'">notifications</span>
    @if (unreadCount$ | async; as unreadCount) {
      <span
        class="admin-nav-badge notification-bell-badge"
        aria-hidden="true"
      >{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
    }
  </button>

  <p-popover
    #overlayPanel
    appendTo="body"
    [styleClass]="overlayStyleClass"
    [style]="{ width: '360px' }"
    (onShow)="onPanelShow()"
    >
    <app-notification-inbox-panel
      [items]="(items$ | async) ?? []"
      [total]="(totalElements$ | async) ?? 0"
      [loading]="(loading$ | async) ?? false"
      [error]="(error$ | async) ?? false"
      [unreadCount]="(unreadCount$ | async) ?? 0"
      (markOne)="onMarkOne($event)"
      (markAllRead)="onMarkAllRead()"
      (retry)="onRetry()"
    ></app-notification-inbox-panel>
  </p-popover>
</div>
