<button
  type="button"
  class="notification-row"
  [class.is-unread]="!item.read"
  [attr.aria-label]="ariaLabel"
  (click)="onClick()"
  >
  <span class="notification-row-indicator" aria-hidden="true">
    @if (!item.read) {
      <span class="notification-row-dot"></span>
    }
  </span>
  <span class="notification-row-body">
    <span class="notification-row-message">{{ item.message }}</span>
    <span class="notification-row-timestamp">{{ formattedTimestamp }}</span>
  </span>
</button>
