<div class="card-container payment-card">
  <div class="tab-group">
    <button
      type="button"
      class="tab is-active"
      aria-current="true"
      (click)="selectTab('creditcard')"
    >
      <img src="icons/payment-creditcard.svg" alt="Credit card icon" />
      <span>{{ "PAYMENT.TAB.CREDIT" | translate }}</span>
    </button>
    <button
      type="button"
      class="tab"
      (click)="selectTab('qrcode')"
    >
      <img src="icons/payment-qrcode.svg" alt="QR payment icon" />
      <span>{{ "PAYMENT.TAB.QR" | translate }}</span>
    </button>
  </div>

  <!--
    OBRS-391 — there is deliberately NO card-number / expiry / CVV field on this
    page, and putting one back is not a small change: an input that touches a PAN
    on our own origin moves the whole site from PCI DSS SAQ A to SAQ A-EP (~140
    requirements, quarterly ASV scans, permanently) and re-opens the clause 5.5(f)
    question in the Omise merchant agreement. Omise renders those fields itself,
    inside an iframe served from cdn.omise.co, when the passenger presses the pay
    button below. `npm run test:no-card-inputs` fails the build if one reappears.
  -->
  <p class="hosted-card-hint">
    {{ "PAYMENT.CREDIT_CARD.HOSTED_HINT" | translate }}
  </p>

  <div class="countdown" aria-live="polite">
    {{ "PAYMENT.CREDIT_CARD.COUNTDOWN_LABEL" | translate }}
    <span class="countdown-value">{{ countdown }}</span>
  </div>

  <div class="summary-wrapper">
    <app-payment-summary variant="inline" [amountOverride]="amountOverride"></app-payment-summary>
  </div>
</div>

<div class="payment-actions">
  <div class="payment-action-item">
    <button class="back-btn" type="button" (click)="onBack()">
      {{ "PAYMENT.CREDIT_CARD.BACK" | translate }}
    </button>
  </div>

  <div class="payment-action-item action-end">
    <button
      class="payment-btn"
      type="button"
      (click)="submitPayment()"
      [class.select-btn-diabled]="isSubmittingPayment || isWaitingForConfirmation"
      [disabled]="isSubmittingPayment || isWaitingForConfirmation"
    >
      {{ "PAYMENT.CREDIT_CARD.PAY_NOW" | translate }}
    </button>
  </div>
</div>
