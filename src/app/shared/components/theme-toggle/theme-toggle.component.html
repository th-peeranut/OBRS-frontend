<button
  type="button"
  class="theme-toggle-btn"
  (click)="toggle()"
  [attr.aria-pressed]="isDarkMode"
  [attr.aria-label]="ariaLabelKey | translate"
  [title]="ariaLabelKey | translate"
>
  <span class="material-symbols-outlined" [attr.translate]="'no'">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
</button>
