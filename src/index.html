<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <!--
    OBRS-1194: `lang` above and `title` below are LITERALS on purpose, and that is the
    whole point of the card. OBRS-870 warns "do not ship this piecemeal" — correctly,
    but that warning is about tags written through Angular's `Meta` service, which land
    in the DOM only after JS runs and so are invisible to the LINE/Facebook crawlers
    that never run it. These two sit in the raw HTML Netlify serves, so they reach a
    browser tab AND a crawler with no prerender involved — which is why this half could
    ship alone while the rest of 870 waits.

    `title` was `OBRS` — the internal project key — on every route of a live customer
    site. The wording matches the home page H1 (`จองตั๋ว คิวรถ NJ ผู้ใหญ่ปู ออนไลน์`) and the
    brand query OBRS-498 wants back (`คิวรถ NJ ผู้ใหญ่ปู`).

    `lang` PINS the app default; it does not follow the switcher. Still OBRS-870's and
    still open: per-route titles (needs Angular `Title`), `lang` that tracks the chosen
    language, og:*, meta description, robots.txt, sitemap.xml, prerender.
  -->
  <title>จองตั๋วออนไลน์ คิวรถ NJ ผู้ใหญ่ปู</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg?v=2" sizes="any">
  <!--
    OBRS-719: this file deliberately declares no script of its own, and that is
    load-bearing. (Written without the literal tag spelling on purpose - the Angular
    build copies this comment verbatim into dist/index.html, where a scanner reading
    the shipped page would otherwise count the example as the thing it warns about.)

    It used to bootstrap Google Identity from an inline block. Two costs, both paid on
    every route: the CSP had to allow `script-src 'unsafe-inline'` - which is most of
    what a CSP is for - and Google's script was fetched on the PAYMENT page, where PCI
    DSS 6.4.3 makes every script something we have to justify in writing.

    Both are gone because login.component.ts loads gsi/client itself, which it already
    did for the language switch (OBRS-90). The `hl` locale still has to be a query param
    on the script URL - GIS offers no initialize() option for it - it is just built from
    TranslateService now instead of read straight out of localStorage.

    ⚠️ The build injects tags of its own here, and one of them mattered. Angular's
    `inlineCritical` optimization rewrites the stylesheet link so it loads as print media
    and is switched to all media by an INLINE EVENT HANDLER (spelled out in the inventory
    doc named below - not here, for the same reason as above). `script-src` blocks such a
    handler just as surely as an inline block once 'unsafe-inline' is gone.
    Report-Only hid it; enforcing would have shipped an unstyled app. angular.json now
    sets `optimization.styles.inlineCritical: false`, measured against the emitted
    dist/index.html rather than reasoned about. Do not turn it back on without either
    re-measuring or restoring 'unsafe-inline' - and the second is not an option.

    scripts/check-payment-page-scripts.mjs fails the build if a script declaration
    reappears in this file, inline or sourced, or if that optimization comes back;
    deploy/prod/PAYMENT-PAGE-SCRIPT-INVENTORY.md in OBRS-backend is the written
    inventory that says why each remaining script exists.
  -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
